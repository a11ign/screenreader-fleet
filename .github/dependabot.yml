# Dependency updates come from the platform (a11ign/a11ign ADR 0041, decision 4): a new release of anything this
# repository consumes opens a pull request here, so nobody polls for one. `@a11ign/judge`, `@a11ign/screenreader-worker` and `@a11ign/evidence` are consumed by VERSION, so
# its upgrades arrive as pull requests too, and the repository's consumers' own upgrades to THIS package arrive in theirs.
version: 2
updates:
  - package-ecosystem: npm
    # ONE entry at the root covers the pnpm workspace.
    directory: /
    schedule:
      interval: daily
    # No `groups:` on purpose: each dependency is its own pull request, which is what keeps a bump small and mergeable alone.
    commit-message:
      # The handle the org's gate recognises a dependency pull request by: every title starts `deps:`.
      prefix: deps
    # The one workspace member is linked by pnpm and `changeset version` owns its version; left alone, Dependabot would offer the
    # registry's copy over the workspace's.
    ignore:
      - dependency-name: "@a11ign/screenreader-fleet"
      # 0.2.0 is a BUILD: `workerSourceDir()` is `dist/` and `expectedWorkerCode` throws ENOENT, where 0.1.0 shipped raw `src`.
      # Merging that bump breaks `a11ign-worker-code`. This is DATA rather than a sentence so no pull request is opened to merge by
      # mistake; remove it when a11ign/a11ign#3740 (the expected-hash row) merges. Ruling: a11ign/a11ign#3552, row a11ign/a11ign#3739.
      - dependency-name: "@a11ign/screenreader-worker"
        versions: [">=0.2.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
