# The merge gate. Every pull request and every merge-queue entry runs the layout check, lint, the typecheck and the tests (`checks`), the changeset check
# (`changeset`) and the release's version step (`release-dry-run`), and the last job below, `gate`, waits for all three. It is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the tests here drive nothing real. The fleet's own captures run on the fleet, from the lab.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat
  # would leave the check red on a body that is now right. The cost is the whole gate once per body edit; the concurrency group below cancels the
  # run it replaces.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127, adopted here by #4132; class fix for #4084, where
  # screenreader-worker#25 and #26 merged shipped code with no changeset and nothing released it). `releasable-paths` is this repository's `dora`
  # entry's `releasablePaths` in a11ign/a11ign `.agent-org/project.json`, character for character: a path that matches nothing passes every pull
  # request. The pin is a full sha and Dependabot's `github-actions` entry moves it. On a merge-group entry the called job succeeds without
  # evaluating: the pull request's own run decided.
  changeset:
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone makes GitHub refuse the whole run at startup
    # (`startup_failure`: no job, no log). The called workflow reads the pull request's files, so it needs `pull-requests: read` too.
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@08fcafc094e6b45c993f7754f0dcfd259c96be93
    with:
      releasable-paths: src/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The build comes first because the package is published BUILT (`prepack` runs it at publish), so a build that fails must read red here
      # and not at the release. The tests run on `src` and do not need it; the typecheck and the lint do not either.
      - run: pnpm run build
      # The repository's own layout: a single-package repository has its package at the root (ADR 0043; a11ign/a11ign#4210, adopted here by #4216).
      # `layout-check` is `@a11ign/toolchain`'s, pinned by the lockfile and moved by Dependabot with the rest of it. It reads `git ls-files`, so
      # it needs no build and runs before the slower steps: a monorepo shape coming back by habit reads red in seconds.
      - run: pnpm exec layout-check
      # Lint and typecheck gated every pull request in a11ign/a11ign ("CI gates on both") and were dropped by the move
      # (#3179). They run before the tests so a style or type failure reads red without waiting for the suite.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (a11ign/agent-org#888; chairman, a11ign/agent-org#885 class 3; adopted here by a11ign/a11ign#5059, from
  # the job of a11ign/agent-org#967). agent-org#871 changed an install, passed that repository's own suite, and the first sign of the break was five failed releases on `main`: nothing on the
  # pull request ran the path the release takes. `release.yml` calls `release-per-merge.yml`, whose `version` job installs with `pnpm install --frozen-lockfile`, runs this repository's OWN
  # `changeset version`, then `pnpm install --lockfile-only`. This job runs those three commands in a scratch clone of the candidate tree and writes nothing: `contents: read`, no credential
  # kept by the checkout, no push, no token.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per WORKFLOW and not per job,
  # and a workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it: an untouched change is a `success` here, never a
  # skip, and `gate` keeps accepting `success` alone. The paths are judged against the first parent of the checked-out commit: the merge ref of a pull request or a merge-queue entry.
  #
  # THE TOOLS ARE THE RELEASE'S. `release.yml` here passes none of `pnpm-version`, `changesets-version` or `node-version`, so the called workflow's own rules apply and this job repeats them:
  # pnpm comes from `packageManager` (the `checks` job's `pnpm/action-setup` reads it the same way), the changesets CLI is the one the lockfile pins (`changesets-version` is only for a
  # repository with no lockfile, which `--frozen-lockfile` refuses here in `checks` as well, so there is no second branch to keep), and Node is the called workflow's default, 22.
  # It versions EVERY changeset in the tree, where the release versions only those no tag has consumed: a superset, so a failure the release would meet is met here.
  #
  # THERE IS NO "CONSUMER'S INSTALL" STEP, on purpose: a11ign/agent-org#967 adds one because a11ign's `agent-org-newest-tag` clones an agent-org TAG and installs it. Nothing clones a tag of this
  # repository: it is published to npm (`kind: npm`) and a consumer installs `@a11ign/screenreader-fleet` from the registry, which the called workflow's `publish` job answers for.
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # FULL HISTORY, as the release's own `version` job checks out (`fetch-depth: 0`): `changeset version` asks git which commit added each changeset file and, on a
          # shallow clone, never returns (measured: a depth-1 clone of a depth-2 checkout spun at full CPU until killed at 90 s; the same tree cloned from full history ran in 1 s).
          # `touched` needs only HEAD and its first parent. No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      # Before setup-node, as in `checks`: no `version`, so the action reads `packageManager`, which is what the release's `setup` step hands it.
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          pnpm install --frozen-lockfile
          pnpm exec changeset version
          pnpm install --lockfile-only

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It
  # waits for all three jobs above and accepts `success` ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts as
  # passed; and no `skipped` allowance, because the changeset job succeeds on a merge-group entry rather than skipping, so a skip here means it did not run. `release-dry-run` is the same: an untouched change is a `success` there, never a skip.
  gate:
    needs: [changeset, checks, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          for result in "${{ needs.changeset.result }}" "${{ needs.checks.result }}" "${{ needs.release-dry-run.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a job reported '$result', not success"
              exit 1
            fi
          done
