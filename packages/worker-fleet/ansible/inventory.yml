# The fleet, as data — and the ONE place a machine is added.
#
# `A11Y_WORKERS` is a comma-separated string in an environment variable, which was fine for two VMs and
# is the wrong shape for twelve boxes: it cannot hold a hostname, a note about which machine is which, or
# the fact that one of them is off this week. This file is canonical and the env var is DERIVED from it:
#
#     eval "$(npm run --silent fleet:env)"      # exports A11Y_WORKERS from this inventory
#
# Deriving in that direction and not the other is deliberate. Two sources of truth for "what is the fleet"
# is how a box comes to be provisioned but never dispatched to, or dispatched to but never updated — and
# both of those failures are silent.
#
# ## Adding a machine
#
# Give it the next `a11y-worker-N` name and its address. Everything else is inherited. Then:
#
#     ansible-playbook ssh-key.yml -l a11y-worker-4     # only if it was not installed at first boot
#     ansible-playbook provision.yml -l a11y-worker-4
#
# ## Waking them
#
# The fleet is not meant to run 24/7, so `wake.yml` powers boxes on and `sleep.yml` powers them down.
# Three prerequisites, and only the last two are automated:
#
#   1. **Wake-on-LAN enabled in the box's own firmware.** Per machine, at the console, once. Nothing can
#      automate this — the box is off and has no OS running to ask.
#   2. The adapter must be allowed to wake it. `a11y_nic_power` does that, and note it writes
#      PnPCapabilities 8 rather than 24 on the registry fallback: 24 also disables wake, which would make
#      all of this impossible while reporting success.
#   3. Fast Startup must be off, or many boards will not wake from a "shutdown" at all — it is a hybrid
#      hibernate, not a real S5. `a11y_power_timeouts` turns hibernation off, which disables Fast Startup
#      as a side effect. That is a real dependency between two modules, not a coincidence.

## A machine that is switched off
#
# Leave it here and let it be unreachable. `any_errors_fatal = false` means the rest of the fleet still
# gets the play, and the recap names the box that did not answer — which is the report you want. Deleting
# it from the inventory to make a run go green is how a machine stops being maintained.
all:
  children:
    a11y_workers:
      # Two facts that apply to every box below, learned from the first one and worth keeping after it:
      #
      #   - Give each box a DHCP RESERVATION. The first bare-metal worker moved from .83 to .102 by DHCP
      #     and a probe of the old address returned nothing — which is indistinguishable from a dead
      #     machine. `fleet:discover` exists to catch that drift, but a reservation prevents it.
      #   - The `mac` is what `wake.yml` sends the magic packet to, and it is the ONE fact about a box that
      #     cannot be discovered while the box is off. `fleet:discover --enroll` reads it from ARP while the
      #     box is up; a worker with no `mac` is SKIPPED AND NAMED by wake.yml rather than silently
      #     not woken.
      #
      # `a11y-worker-1` (Dell Wyse thin client, REDACTED-INTERNAL-ADDRESS, OUI 00:80:64) was RETIRED on 2026-08-16 —
      # too slow to be worth a slot. Removed deliberately, which is not the same as the deletion this
      # file warns about: that one is about dropping a box to make a run go green, and leaves a real
      # machine unmaintained. Note the number is NOT reused — `nextWorkerName` skips it, because run
      # summaries and notes refer to boxes by name long after they are gone.
      hosts:
        a11y-worker-2:
          # Enrolled by `fleet:discover --enroll` on 2026-08-16: NVDA 2026.1.1, Microsoft Windows 11 Pro 10.0.22631/x64
          ansible_host: REDACTED-INTERNAL-ADDRESS
          mac: "e8:6a:64:e2:3c:8d"

        a11y-worker-3:
          # Enrolled by `fleet:discover --enroll` on 2026-08-16: NVDA 2026.1.1, Microsoft Windows 11 Pro 10.0.22631/x64
          ansible_host: REDACTED-INTERNAL-ADDRESS
          mac: "8c:16:45:9d:0f:1b"

        a11y-worker-4:
          # Enrolled by `fleet:discover --enroll` on 2026-08-16: NVDA 2026.1.1, Microsoft Windows 11 Pro 10.0.22631/x64
          ansible_host: REDACTED-INTERNAL-ADDRESS
          mac: "e8:6a:64:e3:a9:e6"

        a11y-worker-5:
          # Enrolled by `fleet:discover --enroll` on 2026-08-16: NVDA 2026.1.1, Microsoft Windows 11 Pro 10.0.22631/x64
          ansible_host: REDACTED-INTERNAL-ADDRESS
          mac: "6c:4b:90:70:1a:3d"

    ## The control plane — in the inventory because it EXISTS, not because it captures
    #
    # Added 2026-08-21, and it could not have been added before that date: `fleet-env.mjs` read every
    # `ansible_host:` in this file as a capture worker at :8765, so putting the lab here would have put
    # `http://REDACTED-INTERNAL-ADDRESS:8765` into `A11Y_WORKERS` and a run would have dispatched capture cases to a
    # box with no NVDA on it. The reader is now group-aware and `fleet-env.test.ts` asserts a host in
    # another group never becomes a worker, in either group order.
    #
    # Two containers on one Proxmox host (`pve-micro`, REDACTED-INTERNAL-ADDRESS), split per ADR 0012 so the credential
    # that can reconfigure twelve Windows boxes does not sit beside the largest supply-chain surface in the
    # system. `control` holds Ansible and the fleet key; `lab` holds node_modules, the venv and the corpus,
    # and holds NO key — it can WAKE a worker, because a magic packet needs no credential, and nothing else.
    #
    # Both are DHCP and their descriptions say to confirm rather than trust the address:
    #
    #     pct exec 121 -- ip -4 -br addr show eth0
    #
    # A DHCP reservation for each is worth having for the same reason the workers have one: a moved address
    # answers nothing, and nothing-answering is indistinguishable from a dead machine.
    ## fleet CONTROL — the box these playbooks actually run FROM
    #
    # Here for the same reason the lab is: one source of truth for the machines that exist. It is NOT a
    # target of `deploy.yml`, `wake.yml` or `provision*.yml`, all of which name `a11y_workers`.
    #
    # This is the half of ADR 0012's split that holds the fleet SSH key, which is why worker playbooks can
    # only be run from here and not from a developer's Mac.
    a11y_control:
      hosts:
        a11y-control:
          # CT 120 on pve-micro. Debian 12, 1 core, 1024 MB — it runs Ansible and holds the key, nothing else.
          ansible_host: REDACTED-INTERNAL-ADDRESS

    a11y_lab:
      hosts:
        a11y-lab:
          # CT 121 on pve-micro. Debian 12, 2 cores, 4096 MB. Reached directly over SSH with the
          # `a11y-pve` key — NOT through `pct exec` on the host, which is a second hop and therefore a
          # second layer of shell quoting for every command to survive.
          ansible_host: REDACTED-INTERNAL-ADDRESS

    # The Proxmox host both containers run on. Here because it is the ONE machine that needs Tailscale: it
    # advertises a route to every other host in this file, so the fleet becomes reachable from anywhere
    # without an agent on any worker and without touching the unprivileged containers — where Tailscale
    # would need TUN passed through from the host and would erode the isolation ADR 0012 chose.
    #
    # It is NOT a capture worker and must never become one. `fleet-env.mjs` reads a host's group from its
    # PATH (`all.children.<group>.hosts`) rather than matching on `ansible_host:`, so a host outside
    # `a11y_workers` cannot turn into a phantom worker URL — which is the failure that guard exists for.
    a11y_hypervisor:
      hosts:
        pve-micro:
          ansible_host: REDACTED-INTERNAL-ADDRESS

    # Machines that are NOT part of the capture fleet but should be reachable over the tailnet.
    #
    # Here so the Tailscale routes stay derived from ONE list rather than a second one kept in step by
    # hand — that is the whole reason `tailscale.yml` builds its routes from this file. Nothing else reads
    # this group: every playbook names the group it targets, so a host here is never deployed to, woken,
    # or dispatched work, and `fleet-env.mjs` reads a host's group from its path so it cannot become a
    # phantom capture worker.
    a11y_tailnet_only:
      hosts:
        ai-server:
          ansible_host: REDACTED-INTERNAL-ADDRESS
