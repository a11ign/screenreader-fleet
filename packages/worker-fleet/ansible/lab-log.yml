---
# What did a job actually SAY? Its own output, unwrapped.
#
#     npm run lab:log -- -e job=grants-audit
#     npm run lab:log -- -e job=train -e lines=800
#
# ## Why this exists
#
# `lab-status.yml` already shows the journal, and it shows it through Ansible's `debug`, which wraps every
# line at ~90 characters, re-indents it, and quotes it as YAML. A report designed to be read — a table of
# per-defect counts, a transcript, a threshold sweep — arrives as fragments:
#
#     - 'Aug 25 21:04:11 a11y-lab python[1007311]:     "1.3.1: 2 acceptance false positive(s):
#         acceptance-link-permits/bad, acceptance-link-permits/bad",'
#
# Measured 2026-08-25: reading one audit's output took eleven separate `awk | sed | grep` pipelines across
# the session, each hand-written, one of which silently matched nothing. That is the defect CLAUDE.md
# names about journals — "improvising around a tool the repo already has is itself a defect source" — with
# the twist that the tool was the thing producing the fragments.
#
# So the journal is written to a file on the lab and FETCHED, exactly as `lab-fetch.yml` does for reports.
# Bytes, not YAML.
#
# Bounded to ONE INVOCATION, for the reason `lab-status.yml` already carries a task about: `journalctl -u`
# returns every run of that unit since boot, oldest first, so a job that has run before hands back its
# predecessor's output above its own. Three separate misdiagnoses came from exactly that.
- name: Fetch a job's own output
  hosts: a11y_lab
  gather_facts: false

  tasks:
    - name: That is a job this lab has
      # A TYPO and a job that has not run are different facts, and both used to arrive as "it has not run, or the journal was rotated" — which sends the reader to the journal. The
      # catalogue is read from `lab-job.yml`, the file that defines it, so this cannot come to name a job
      # that no longer exists.
      ansible.builtin.assert:
        that: job in (lookup('file', playbook_dir ~ '/lab-job.yml') | from_yaml)[0].vars.lab_jobs
        fail_msg: >-
          '{{ job }}' is not a job this lab has. Nothing was lost and no journal rotated; the name is not one.
          `npm run lab:job` lists every job that can be started.
      when: job is defined

    - name: A job must be named
      ansible.builtin.assert:
        that:
          - job is defined
          - job is match('^[a-z][a-z0-9-]{0,40}$')
        fail_msg: "Pass -e job=<name>, the same name you dispatched with."

    - name: How many lines
      # Contained by shape like every other value that reaches a command on this box.
      ansible.builtin.assert:
        that: (lines | default(400)) | int > 0 and (lines | default(400)) | int <= 5000
        fail_msg: "-e lines= must be 1..5000."

    - name: Which invocation was the last one
      ansible.builtin.command:
        argv: [systemctl, show, "-p", InvocationID, "--value", "a11y-job-{{ job }}"]
      register: invocation
      changed_when: false
      failed_when: false

    - name: Failing that, find its LAST invocation in the journal
      # `run-job.yml` ends with `systemctl stop`, which releases the unit name AND clears its
      # InvocationID -- so by the time a job finishes, `systemctl show` reports nothing and this playbook
      # refused with "it has not run". Measured 2026-08-25: I re-read a stale log file four times and
      # concluded a fix was not landing, when the log had simply never been refreshed.
      #
      # The journal still holds every invocation, so the last one is recoverable by asking it directly.
      # `-o json` then the field, rather than parsing free text.
      when: (invocation.stdout | default('') | trim) == ''
      # `--output=verbose`, which is the only mode that emits the systemd metadata. Two earlier attempts
      # failed differently and are worth naming: `--output=json` piped into python inside a `>-` folding
      # scalar had its lines joined and its quoting broken, and `--output=cat --output-fields=` printed
      # NOTHING, because cat emits the message and not the trusted fields. Checked on the box rather than
      # inferred, after the second one looked like "the job has never run".
      ansible.builtin.shell:
        # ONE command, no pipeline to fold and no quoting to lose. `--output=verbose` is the only mode
        # that emits systemd metadata; two earlier attempts failed differently and are worth naming so
        # nobody repeats them: `--output=json` piped into python inside a `>-` folding scalar had its
        # lines joined and its quoting broken, and `--output=cat --output-fields=` printed NOTHING,
        # because cat emits the message and not the trusted fields. Both looked like "the job never ran".
        cmd: journalctl -u a11y-job-{{ job }} -n 1 --output=verbose --no-pager | sed -n 's/^ *INVOCATION_ID=//p' | head -1
      register: from_journal
      changed_when: false
      failed_when: false

    - name: Settle which invocation to read
      ansible.builtin.set_fact:
        lab_invocation: "{{ (invocation.stdout | default('') | trim) or (from_journal.stdout | default('') | trim) }}"

    - name: Say if that job has never run
      # A unit systemd has never heard of answers with an empty InvocationID, and filtering the journal on
      # an empty one returns the WHOLE journal — other units' output, presented as this job's. Refuse.
      when: lab_invocation == ''
      ansible.builtin.fail:
        msg: >-
          a11y-job-{{ job }} has no invocation on {{ inventory_hostname }} — it has not run, or the unit
          was reaped. `npm run lab:status -- -e job={{ job }}` reports which.

    - name: Write this invocation's output to a file
      ansible.builtin.shell:
        cmd: >-
          journalctl _SYSTEMD_INVOCATION_ID={{ lab_invocation }} --no-pager --output=cat
          -n {{ (lines | default(400)) | int }} > /tmp/a11y-job-{{ job }}.log
      changed_when: false

    - name: Bring it back
      ansible.builtin.fetch:
        src: "/tmp/a11y-job-{{ job }}.log"
        # ANCHORED to the repo root, not relative. A bare `runs/fetched/...` resolves against the
        # PLAYBOOK directory, so the first version landed the file in
        # `packages/worker-fleet/ansible/runs/fetched/` and reported success. `lab-fetch.yml` had the
        # correct form twelve lines away; I wrote a second path convention rather than reading it.
        dest: "{{ playbook_dir }}/../../../runs/fetched/{{ job }}.log"
        flat: true
      register: fetched

    - name: Where it landed
      ansible.builtin.debug:
        msg: "runs/fetched/{{ job }}.log ({{ fetched.dest | default('?') }})"
