---
# Run a long lab job by NAME, and wait for its real exit code.
#
#     ansible-playbook lab-job.yml -e job=train
#     ansible-playbook lab-job.yml -e job=sweep -e model=runs/model-candidate
#     ansible-playbook lab-job.yml -e job=capture-real-pages -e role=training -e shard=0/4 -e worker=a11y-worker-2
#
# ## Named jobs, never a command
#
# The catalogue below is the whole interface, and that is the security design rather than a convenience.
# This plays against the box holding the capture corpus (not reproducible — `browserVersion` is a capture
# cache key), the `a11y-corpus` GitHub deploy key, the release weights, and the ability to wake twelve
# Windows machines. `ansible/README.md` rejected an `/admin/update` route on a WORKER because "a mutating
# route there is unauthenticated remote code execution on twelve boxes"; a route that runs training jobs is
# strictly worse, since executing code is its entire purpose. Ansible is agentless, so there is no route to
# secure — but a free-form `command` parameter would put one back.
#
# So: no `command` variable exists. `argv` comes from this file, and the only things a caller supplies are
# CHOICES, checked below.
#
# ## The parameters are enums and names, not paths and URLs
#
# `worker=a11y-worker-2` resolves through the inventory to an address. That is not decoration: it makes an
# arbitrary URL INEXPRESSIBLE rather than rejected, which is the same shape as `isValidCaptureId` on the
# worker ("path traversal is the reason this check exists"). `role` and `shard` are checked the same way,
# and note `--shard` is validated a second time by `shard.mjs` at the far end — deliberately, because a
# malformed shard silently doing the whole list means four runs each fetching all 77 pages from other
# people's sites.
#
# ## Deliberately NOT here
#
# No env passthrough. `A11Y_PYTHON` is read at four sites in this repo and becomes the executed
# interpreter, so a caller-supplied environment is arbitrary code execution with a whitelisted job name and
# an empty argv. `run-job.yml` builds a fixed env and nothing reaches it from here.
- name: Run a lab job
  hosts: a11y_lab
  gather_facts: false

  vars:
    # Every job this playbook can run. `timeout` becomes `RuntimeMaxSec`, so it is a real ceiling rather
    # than advice — set it above the slowest honest run, because a deadline that expires early turns "still
    # working" into "failed".
    lab_jobs:
      train:
        # Trains to a SCRATCH directory on purpose. The trainer now refuses to overwrite a release-eligible
        # model without `--allow-overwrite`, and promoting is a separate, deliberate step — one was already
        # lost to a `git checkout` on the assumption that a tracked file is always recoverable.
        # `-e out=<name>` names WHICH scratch directory, from a fixed list. A path is not expressible.
        #
        # It was hardcoded to `runs/model-candidate`, which made the job single-use: the trainer refuses to
        # overwrite a release-eligible model, so the SECOND train always failed with "REFUSING to
        # overwrite". Measured 2026-08-22 — the multi-defect retrain died on it in 1.9 s.
        #
        # The fix is not `--allow-overwrite`. That guard exists because a model was lost once, and a job
        # that always passes the flag is a guard nobody has. Naming the output keeps every candidate,
        # which is also what makes a comparison possible: shipped vs candidate vs multidefect, side by
        # side, rather than each one destroying its predecessor.
        argv: ["{{ lab_python }}", "packages/lab/scripts/train-screenreader-model.py",
               "--data", "runs/screenreader-dataset/with-realism.jsonl",
               "--output", "runs/model-{{ out | default('candidate') }}"]
        timeout: 3600
      build-realism:
        argv: ["/usr/bin/node", "packages/lab/scripts/build-realism-tier.mjs",
               "--out=runs/screenreader-dataset/with-realism.jsonl"]
        timeout: 900
      sweep:
        argv: ["/usr/bin/node", "packages/lab/scripts/calibrate-abstention.mjs"]
        timeout: 1800
      # WHICH records does a head fire on wrongly, and what do they have in common? A report says "36 false
      # positives" and cannot distinguish "the head lost a veto that was doing real work" from "something
      # specific changed about one group of pages" — opposite fixes, and the second is invisible to every
      # summary statistic.
      false-positives:
        argv: ["{{ lab_python }}", "packages/lab/scripts/diagnose-false-positives.py",
               "--model", "runs/model-{{ out | default('candidate') }}",
               "--data", "runs/screenreader-dataset/with-realism.jsonl",
               "--out", "runs/model-{{ out | default('candidate') }}/false-positives.json"]
        timeout: 1800
      # The veto audit, against a NAMED candidate rather than the shipped weights. `release:gate` runs the
      # same audit but always on what is shipped, which cannot answer "did this retrain help?" — the
      # question a candidate exists to settle. Reads files already on disk; no worker, seconds.
      shortcuts:
        argv: ["{{ lab_python }}", "packages/lab/scripts/audit-scorer-shortcuts.py",
               "--model", "runs/model-{{ out | default('candidate') }}",
               "--data", "runs/screenreader-dataset/with-realism.jsonl",
               "--no-baseline"]
        timeout: 900
      acceptance:
        argv: ["{{ lab_python }}", "packages/lab/scripts/evaluate-screenreader-acceptance.py",
               "--data", "runs/screenreader-acceptance/repeat-1.jsonl",
               "--data", "runs/screenreader-acceptance/repeat-2.jsonl",
               # The disjointness proof must be against what the model was actually TRAINED on. Defaulting
               # to the base dataset means it never examines the realism tier.
               "--training-data", "runs/screenreader-dataset/with-realism.jsonl",
               # All three follow `out`, or the gate grades one model and files its verdict under another.
               # Half-parameterising this is worse than not doing it: the report would LOOK like it belongs
               # to the new candidate while describing the old one.
               "--model", "runs/model-{{ out | default('candidate') }}",
               "--training-report", "runs/model-{{ out | default('candidate') }}/training-report.json",
               # NO `--allow-ineligible` here, deliberately. It was needed until 2026-08-23, when the
               # eligibility guard lived in `verify_artifact` for every caller alike: the trainer marks a
               # fresh candidate ineligible BECAUSE acceptance has not run, and the evaluator refused any
               # ineligible model — so the gate that would qualify a candidate declined to run on an
               # unqualified one. The fix is at the call site, where the evaluator declares it does not
               # require eligibility, rather than here where a job would pass a flag every single time.
               "--out", "runs/model-{{ out | default('candidate') }}/acceptance-report.json"]
        timeout: 1800
      capture-real-pages:
        argv: ["/usr/bin/node", "packages/lab/src/training/capture-real-pages.mjs",
               "--role={{ role | default('training') }}",
               "--shard={{ shard | default('0/1') }}",
               "--worker=http://{{ hostvars[worker | default('')].ansible_host | default('') }}:8765"]
        # 77 real pages on one worker measured ~6.5 h; a quarter of them ~1.6 h. Generous either way.
        timeout: 28800
      check-signals:
        argv: ["/usr/bin/node", "packages/lab/src/training/check-signals.mjs"]
        timeout: 900
      # THE SYNTHETIC CORPUS, across the WHOLE FLEET. `A11Y_WORKERS` comes from `lab_fleet_workers` below,
      # which is built from the inventory and asserted against a strict pattern — never from the caller, for
      # the reason in this file's header.
      #
      # Pooled because that is the only way the hardware gets used: the runner already dispatches one case
      # per worker from a shared queue, evicts a worker that fails three in a row and hands its cases back.
      # 2,124 captures at the ~30 s each these boxes measure is ~17.7 h on one worker and ~4.4 h on four.
      # GENERATES THE PAGES FIRST, and that is not a convenience.
      #
      # This entry ran `capture-screenreader-dataset.mjs` alone, so it captured whatever pages happened to
      # be on the lab's disk. Measured 2026-08-22: a change that made 808 of 1,061 pairs stale locally was
      # dispatched here, the job pulled the new commit, captured the OLD pages, hit cache on every case and
      # reported success in 13 seconds. A full recapture reported as done, having done nothing — the
      # silent-no-op shape this repo keeps paying for, one layer out from the code that was fixed today.
      #
      # `training:capture` is not enough on its own for the same reason `worker:deploy` is not "copy the
      # files": the artifact under test has to be REBUILT from the checkout the job pulled, or the job is
      # testing the previous commit. Generation is idempotent — same code, same bytes — so this costs
      # nothing on a run where the pages were already current, including a `--resume`.
      capture:
        argv: ["/usr/bin/npm", "run", "training:capture:fresh"]
        setenv: ["A11Y_WORKERS={{ lab_fleet_workers }}"]
        # Above the ~4.4 h a full recapture measures, because a ceiling that expires early turns "still
        # working" into "failed" — and this is the most expensive job in the catalogue to lose.
        timeout: 28800
      # Cheap, and here because it is a STEP rather than a check: it rewrites the labels every later stage
      # reads, and it silently used a stale manifest twice in one session before the drift guard existed.
      export:
        argv: ["/usr/bin/node", "packages/lab/src/training/export-screenreader-dataset.mjs"]
        timeout: 900
      # The gate that must pass before a corpus run, and the one that must pass after a rule change. Both
      # were run by hand today, which is the same reason `evidence-check` and `export` are here.
      #
      # `gate:stability` captures 6 canary pages 5 times each and compares by CONTENT, so it needs a worker
      # and takes ~25 min. One worker, like evidence-check and for the same reason: it is asking whether the
      # PIPELINE is deterministic, and a second guest is a second variable.
      stability:
        argv: ["{{ lab_tsx }}", "packages/lab/scripts/stability-gate.mjs"]
        setenv: ["A11Y_WORKER={{ lab_named_worker }}"]
        timeout: 5400
      # THE COMPOSITE, and the only entry that delegates to an npm script rather than naming a binary.
      #
      # That is deliberate: `release:gate` IS the ordering -- isolation, then signals, then rules, then
      # held-out acceptance, then judge quality, cheapest first so a cheap failure does not wait behind an
      # expensive one. Re-listing the five here would duplicate that ordering into a second place, and the
      # two would drift; the thing being run is a sequence, not a program.
      #
      # `npm run <fixed name>` interpolates nothing, so it introduces none of the quoting risk the argv rule
      # exists to remove. Every component reads from disk and the venv -- none needs a capture worker, which
      # is why this can run while the fleet is doing something else.
      release-gate:
        argv: ["/usr/bin/npm", "run", "release:gate"]
        # eval:gate alone is 34 fixtures x EVAL_RUNS=3 against the local scorer.
        timeout: 5400
      # No worker: it scores the rule layer against captures already on disk. Seconds, and here because it
      # is what says whether the corpus still supports every boundary `rule-ownership.json` declares.
      rules-gate:
        argv: ["{{ lab_tsx }}", "packages/lab/scripts/score-rules.ts", "--gate"]
        timeout: 900
      # POOLED, and this entry used to say the opposite — "single worker ON PURPOSE, because a second guest
      # is a second variable". That argument does not survive inspection: the BASELINE corpus was itself
      # captured across all four workers, so using one fresh worker does not remove the confound, it only
      # hides which side of the comparison it sits on. What actually defends the diff is fleet consistency,
      # which `fleet:status` proves — and which was itself inert until the browserVersion memo was fixed.
      # Check it is consistent before trusting a CHANGED verdict.
      # `argv` is a LIST, so the addresses are spliced in as
      # separate elements — joining them with a space would hand the script one argument containing four
      # URLs, which is the quoting class `argv:` exists to remove, reintroduced by hand.
      evidence-check:
        argv: "{{ [lab_tsx, 'packages/lab/scripts/evidence-check.mjs']
                  + (lab_fleet_workers | split(','))
                  + ['--sample=' ~ (sample | default(24) | int)] }}"
        timeout: 7200

  tasks:
    - name: A job must be named, and it must be one we have
      ansible.builtin.assert:
        that:
          - job is defined
          - job in lab_jobs
        fail_msg: >-
          Pass -e job=<name>, one of: {{ lab_jobs.keys() | list | join(', ') }}.
          There is deliberately no way to pass a command: see this playbook's header.

    # Only for the job that needs it, and only from the inventory. An address cannot be supplied directly,
    # so `--worker=http://:8765` — which cost 29 minutes — is not a value this interface can express.
    - name: A capture job names a worker from the inventory
      when: job == 'capture-real-pages'
      ansible.builtin.assert:
        that:
          - worker is defined
          - worker in groups['a11y_workers']
          - role | default('training') in ['training', 'calibration']
          - shard | default('0/1') is match('^[0-9]+/[0-9]+$')
        fail_msg: >-
          capture-real-pages needs -e worker=<name from a11y_workers>
          ({{ groups['a11y_workers'] | join(', ') }}), optionally -e role=training|calibration and
          -e shard=i/n. The worker is named rather than addressed so a malformed URL cannot be expressed.

    # Same containment as `worker` and `role`: a NAME from a fixed list, never a path. `--output` is a
    # directory the trainer creates and writes weights into, so an unvalidated value here would be an
    # arbitrary write on the box holding the corpus and the release keys.
    - name: A train job names its scratch output from a fixed list
      when: job in ['train', 'acceptance', 'shortcuts', 'false-positives']
      ansible.builtin.assert:
        that: out | default('candidate') in ['candidate', 'multidefect', 'varied', 'scratch']
        fail_msg: >-
          -e out=<name> must be one of: candidate, multidefect, varied, scratch. It is a NAME, not a path — the
          trainer writes weights into `runs/model-<name>`, so a path here would be an arbitrary write.
          Add a name to this list if you need another; do not pass a directory.

    - name: A stability gate names one worker from the inventory
      when: job == 'stability'
      ansible.builtin.assert:
        that:
          - worker is defined
          - worker in groups['a11y_workers']
        fail_msg: >-
          stability needs -e worker=<name from a11y_workers> ({{ groups['a11y_workers'] | join(', ') }}).
          One worker, on purpose: it asks whether the pipeline is deterministic, so a second guest is a
          second variable.

    # Built and then asserted, exactly like `lab_fleet_workers` -- an address that reaches the environment
    # must be proved to be an address, or `--worker=http://:8765` returns by a different door.
    - name: Address the one named worker, for the jobs that take a single guest
      when: worker is defined and worker in (groups['a11y_workers'] | default([]))
      ansible.builtin.set_fact:
        lab_named_worker: "http://{{ hostvars[worker].ansible_host }}:8765"

    - name: That address must be exactly an address
      when: lab_named_worker is defined
      ansible.builtin.assert:
        that:
          - lab_named_worker is match('^http://[0-9.]+:8765$')
        fail_msg: >-
          Refusing to run: A11Y_WORKER would be {{ lab_named_worker | truncate(80) }}, which is not a worker
          address. Something has overridden the inventory.

    - name: An evidence check names one worker, and a sample size that is a number
      when: job == 'evidence-check'
      ansible.builtin.assert:
        that:
          - (sample | default(24)) | int > 0
          - (sample | default(24)) | int <= 200
        fail_msg: >-
          evidence-check takes optionally -e sample=<1..200>. It no longer names a worker: it runs across the
          whole fleet from the inventory, which is asserted to be an address list before it is used.

    # BUILT HERE, from the inventory, and then asserted — not interpolated straight into the env.
    #
    # Extra vars have the highest precedence in Ansible, so a value referenced from the job catalogue is
    # reachable by `-e` even when it looks like it comes from the inventory. The assert is what makes an
    # injected `A11Y_WORKERS` inexpressible rather than merely unlikely: the same shape as `isValidCaptureId`
    # and the `--worker` rule above, and the same reason — this env is read by a process that runs as root
    # on the box holding the corpus.
    - name: Address every worker in the fleet, for the jobs that pool
      ansible.builtin.set_fact:
        lab_fleet_workers: >-
          {{ groups['a11y_workers']
             | map('extract', hostvars, 'ansible_host')
             | map('regex_replace', '^(.*)$', 'http://\1:8765')
             | join(',') }}

    - name: The fleet address list must be exactly that, and nothing else
      ansible.builtin.assert:
        that:
          - lab_fleet_workers is match('^http://[0-9.]+:8765(,http://[0-9.]+:8765)*$')
        fail_msg: >-
          Refusing to run: A11Y_WORKERS would be {{ lab_fleet_workers | truncate(120) }}, which is not a
          plain comma-separated list of worker addresses. Something has overridden the inventory.

    - name: "Run {{ job }}"
      ansible.builtin.include_tasks: tasks/run-job.yml
      vars:
        job_name: "{{ job }}"
        job_argv: "{{ lab_jobs[job].argv }}"
        job_setenv: "{{ lab_jobs[job].setenv | default([]) }}"
        job_timeout: "{{ lab_jobs[job].timeout }}"
