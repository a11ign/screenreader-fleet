---
# What is the lab doing, and did the last job finish?
#
#     ansible-playbook lab-status.yml
#     ansible-playbook lab-status.yml -e job=train      # one job, with its recent output
#
# ## Two independent sources, deliberately
#
# `systemctl` is systemd's view of the process. The progress file is the job's own self-report. They can
# disagree, and the disagreement is the diagnosis:
#
#   - active + progress advancing      → working
#   - active + progress STALE          → wedged; alive but not getting anywhere
#   - inactive + progress incomplete   → died mid-run, and the last phase says where
#   - inactive + progress complete     → finished
#
# Before this existed those states were one state — "no answer" — and telling them apart took six read-only
# commands, one of which searched the wrong directory for logs. `ansible/README.md` states the rule this
# implements: "Verification never shares a failure mode with the action." A status check that asked only
# systemd would report a wedged job as healthy, and one that asked only the file would report a crashed job
# as merely quiet.
#
# ## Read-only
#
# Nothing here mutates. That is what makes it safe to run at any time, including while a job is mid-flight,
# and it is why there is no `--force`, no cleanup, and no restart: this answers a question, and acting on
# the answer is `lab-job.yml`'s business.
- name: What the lab is doing
  hosts: a11y_lab
  gather_facts: false

  tasks:
    # `list-units --all` rather than a name we guessed, so a job nobody remembered starting still shows up.
    # `--plain --no-legend` because the decorated output has a header and a footer to strip.
    - name: Which a11y jobs exist at all
      ansible.builtin.command:
        argv: [systemctl, list-units, "--all", "--plain", "--no-legend", "a11y-job-*"]
      register: units
      changed_when: false

    - name: Every unit, with its state
      ansible.builtin.debug:
        msg: "{{ units.stdout_lines | default(['(no a11y-job-* units — nothing has run since boot)']) }}"

    # SubState first and separately, for the reason `run-job.yml` documents: with `--remain-after-exit` an
    # exited unit reads `active` forever, so `is-active` cannot tell finished from running, and `Result`
    # is populated while a job is still going.
    - name: That is a job this lab has
      # "The job finished" and "there is no job by that name" both produced `SubState=dead` and exit 0, so
      # asking about a TYPO reported success — and a script polling this would read that as fine. It is the
      # same rule as the worker's `404 vs 202`: producing one answer where the other is true is this
      # repo's most expensive recurring shape.
      #
      # The catalogue is read from `lab-job.yml`, the file that defines it, rather than copied here: a
      # second list of job names is exactly how one comes to name a job that no longer exists.
      ansible.builtin.assert:
        that: job in (lookup('file', playbook_dir ~ '/lab-job.yml') | from_yaml)[0].vars.lab_jobs
        fail_msg: >-
          '{{ job }}' is not a job this lab has, so there is no unit to report on — asking about it used
          to answer SubState=dead and exit 0, which is what a FINISHED job answers.
          Run `npm run lab:status` with no -e job= to see every unit that exists, or
          `npm run lab:job` to see every job that can be started.
      when: job is defined

    - name: "Detail for {{ job | default('(no job named)') }}"
      when: job is defined
      ansible.builtin.command:
        argv: [systemctl, show, "-p", SubState, "-p", ActiveState, "-p", Result, "-p", ExecMainStatus,
               "-p", ActiveEnterTimestamp, "a11y-job-{{ job }}"]
      register: detail
      changed_when: false
      failed_when: false

    - name: "systemd's view of {{ job | default('') }}"
      when: job is defined
      ansible.builtin.debug:
        msg: "{{ detail.stdout_lines | default(['(no such unit)']) }}"

    - name: "Which run to show"
      when: job is defined
      ansible.builtin.command:
        argv: [systemctl, show, "-p", InvocationID, "--value", "a11y-job-{{ job }}"]
      register: job_invocation
      changed_when: false
      failed_when: false

    - name: "Its recent output"
      when: job is defined
      ansible.builtin.command:
        # 40 by default, `-e lines=N` when that is not enough — and it often is not. `check-signals`
        # prints a line per case and its SUMMARY comes last, so the one failing case among 1,306 scrolls
        # off and the count is all you can see. A status tool that shows a failure count and not the
        # failure is half a tool.
        # Scoped to ONE invocation when systemd still knows which — see `run-job.yml` for why `-u <unit>`
        # is a trap: it returns every run since boot, oldest first, so a predecessor's output arrives above
        # the current one and only a timestamp tells them apart.
        #
        # But `run-job.yml` RELEASES the unit when a job finishes, and a released unit has no InvocationID.
        # So for anything already complete the id is empty, and scoping on it returned `-- No entries --`:
        # a status tool showing nothing where there is plenty, which is worse than showing too much. Falls
        # back to the unit journal and SAYS SO, because absent and abundant must not look alike.
        argv: "{{ ['journalctl', '--no-pager', '-n', lines | default(40) | string]
               + (['_SYSTEMD_INVOCATION_ID=' ~ (job_invocation.stdout | trim)]
                  if (job_invocation.stdout | default('') | trim | length) > 0
                  else ['-u', 'a11y-job-' ~ job]) }}"
      register: recent
      changed_when: false
      failed_when: false

    - name: "Whether that journal is ONE run or the unit's whole history"
      when: job is defined
      ansible.builtin.debug:
        msg: >-
          {{ 'this invocation only (' ~ (job_invocation.stdout | trim) ~ ')'
             if (job_invocation.stdout | default('') | trim | length) > 0
             else 'ALL runs of this unit since boot, oldest first — the unit has been released, so systemd
                   no longer knows which invocation was last. Read the timestamps.' }}

    - name: "journal for {{ job | default('') }}"
      when: job is defined
      ansible.builtin.debug:
        msg: "{{ recent.stdout_lines | default(['(no journal — has it ever run?)']) }}"

    # The job's OWN report, which is the half systemd cannot give. `training:status` already knows how to
    # read this and reports `eta_minutes` and a `next_command`; this surfaces it without needing a shell on
    # the box. Exit codes are its contract — 0 clean, 1 finished with failures, 2 no run, 3 wedged — so a
    # non-zero here is information rather than a fault, hence `failed_when: false`.
    - name: What that job is, read from the catalogue that defines it
      # `lab_jobs` lives in `lab-job.yml`'s vars and is NOT in scope here — this is a separate playbook.
      # Read once into a fact rather than inline at each use: four copies of the same lookup is four
      # places to get the path wrong, and the first version of this change used `lab_jobs[job]` directly,
      # which is silently undefined and made every job look like one that reports no progress.
      ansible.builtin.set_fact:
        lab_job_entry: "{{ ((lookup('file', playbook_dir ~ '/lab-job.yml') | from_yaml)[0].vars.lab_jobs
                            | default({}))[job] | default({}) }}"
      when: job is defined

    - name: The run's own progress report
      ansible.builtin.command:
        argv: [npm, run, "--silent", "training:status", "--", "--json"]
        chdir: "{{ lab_repo_path }}"
      # A TASK keyword, not a module argument — nested under `command:` it becomes an unknown arg, the task
      # fails, and `progress` registers a dict with no `rc`, which then breaks the debug below with
      # "object of type 'dict' has no attribute 'rc'". The error names the symptom two tasks away from the
      # cause.
      #
      # `training:status` reads DATASET_ROOT, which defaults to the training corpus — so while an
      # ACCEPTANCE job ran, this reported the last training run's finished numbers (`captured: 4,
      # total: 1303`) as if they were the live one. Two runs, one progress file consulted, and the wrong
      # answer looked entirely plausible.
      # ONLY FOR A JOB THAT REPORTS PROGRESS, and the job says whether it does.
      #
      # `training:status` reads DATASET_ROOT and happily reports whatever run that corpus last held. So a
      # job that does not capture at all — `export`, `rules-gate`, `train` — showed the DATASET capture's
      # `captured: 29, total: 1431` under its own name. Two earlier fixes each covered the case somebody
      # had just hit (acceptance, then real-pages) and left every other job reporting a stranger's run.
      #
      # The root cause was not the mapping, it was the ASSUMPTION that every job captures. Five do, and
      # they declare where — `progress:` beside the command, the same shape as `params:`. Everything else
      # gets no progress block and says so, because "this job does not report progress" and "here are some
      # numbers" are different answers and only one of them is true.
      environment:
        DATASET_ROOT: "{{ lab_job_entry.progress | default('') }}"
      when: lab_job_entry.progress is defined
      register: progress
      changed_when: false
      failed_when: false

    - name: This job does not report progress
      # SAID, not left blank. A job with no progress block used to fall through to the training corpus and
      # print its numbers; saying nothing instead would be an improvement and still not an answer. The
      # useful line names WHY there is nothing to show, so the reader stops looking for it.
      ansible.builtin.debug:
        msg: >-
          {{ job }} does not report progress — only a capture job does, and this one is
          {{ (lab_job_entry.argv | default(['?']))[0:3] | join(' ') | truncate(60) }}.
          systemd's view above is the whole answer; its output is `npm run lab:log -- -e job={{ job }}`.
      when:
        - job is defined
        - lab_job_entry.progress is not defined

    - name: What the run says about itself
      when: lab_job_entry.progress is defined
      ansible.builtin.debug:
        # Guarded on the stdout LOOKING like JSON, not merely on being non-empty. `training:status` prints
        # prose on some paths — a warning, a next_command hint — and `from_json` throws on those, which
        # failed the whole task and reported nothing at all. Absent and unparseable must not both become
        # silence: say which one it was.
        msg: >-
          {{ (progress.stdout | from_json)
             if (progress.rc != 2 and (progress.stdout | default('') | trim) is match('^\s*[{[]'))
             else ('(no run in flight — training:status rc=' ~ progress.rc ~ ')'
                   if (progress.stdout | default('') | trim | length) == 0
                   else '(training:status did not return JSON, rc=' ~ progress.rc ~ '): '
                        ~ (progress.stdout | default('') | trim | truncate(300))) }}
