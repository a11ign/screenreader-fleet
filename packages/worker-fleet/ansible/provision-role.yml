---
# Provision a worker with the ROLE rather than the PowerShell script.
#
#     ansible-playbook provision-role.yml -l a11y-worker-1 --check --diff   # look first
#     ansible-playbook provision-role.yml -l a11y-worker-1
#     ansible-playbook provision-role.yml -l a11y-worker-1 --tags policy    # one concern
#
# ## `--check` is safe here, and was not
#
# `win_powershell` SUPPORTS check mode by handing `$Ansible.CheckMode` to the script -- acting on it is
# the script's job, and twelve tasks did not, so a dry run really uninstalled OneDrive and really changed
# powercfg. The mutating ones are modules or guarded now; the `win_shell` tasks are skipped, which is
# honest because they are commands rather than reconcilable state.
#
# ## Why this exists ALONGSIDE provision.yml rather than replacing it
#
# `provision.yml` drives `provision-nvda-worker.ps1` — 816 lines, 39% of them comments recording things
# that have already cost this project days, and untestable in CI because it needs real NVDA on real
# Windows. Replacing it is the point of this role, but replacing it BEFORE the role is proven equivalent
# would mean discovering the gaps one silent capture at a time.
#
# So both exist until parity is demonstrated:
#
#   1. provision one box with the script and one with this role
#   2. compare `/health.environment` — same browser, NVDA, guidepup, OS, protocol
#   3. compare `provisionRevision`
#   4. `npm run capture:check -- --worker=<role-provisioned>` and `npm run evidence:check <worker>`
#
# Only then does the script go, along with `normalise-fleet.mjs`, `guest-run.mjs` and
# `guest/normalise-fleet.cmd` — the last of which this role's `policy.yml` already replaces, and for
# bare-metal workers it replaces something that never worked there at all.
#
# ## provisionRevision will move, and that costs a recapture
#
# It is currently a hash of provision-nvda-worker.ps1 + run-server.cmd +
# apply-foreground-lock-timeout.ps1, and it is a CAPTURE CACHE KEY. Deleting the first file necessarily
# changes it and invalidates all 2,122 cached captures. Bundle that with any pending
# CAPTURE_PROTOCOL_VERSION bump so the corpus is recaptured once rather than twice; a full recapture
# measured 3 h 46 m across three workers.
- name: Provision the capture workers (role)
  hosts: a11y_workers
  gather_facts: false
  # ONE AT A TIME BY DEFAULT — and the reason is NOT the one this line used to give.
  #
  # It said: "a fleet-wide simultaneous restart means every machine is unavailable at once rather than one
  # at a time — which matters if a run is in flight against the others." That defends a situation that must
  # never be allowed to happen. Provisioning during a run does not merely make boxes unavailable: it
  # restarts a worker mid-capture, destroying 12–520 s of screen-reader work that cannot be resumed, and it
  # moves `provisionRevision` on some boxes and not others — which is a CAPTURE CACHE KEY and a
  # `fleet-consistency` MUST_MATCH field, so the run's own evidence ends up split across two populations.
  # `serial: 1` made that survivable instead of impossible, which is the wrong shape: it is a mitigation
  # standing in for a refusal.
  #
  # `sleep.yml` already had the refusal — twenty lines away, in a sibling playbook — and its comment states
  # the rule: "a run must never shut down a worker somebody else is using". The pre_task below is that
  # check, and with it the availability argument for serialising is simply gone.
  #
  # What remains is FAIL-FAST ON A CHANGED ROLE: with `serial: 1` a role that breaks a box breaks one box
  # and stops. That is worth having the first time you run a modified role, and worth nothing on a routine
  # converge — so it is a choice now rather than a constant. `-e worker_provision_serial=0` runs the whole
  # fleet at once (`ansible.cfg` already sets `forks = 20`), which is what converging a fleet after adding
  # a box actually wants.
  serial: "{{ worker_provision_serial | default(1) }}"

  pre_tasks:
    - name: Is any worker mid-capture
      # Asked over HTTP from the control plane, deliberately NOT over the SSH connection — the same
      # question the dispatcher asks, answered the same way, so the two cannot disagree about "busy".
      # Copied in shape from `sleep.yml`, which learned it first.
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ a11y_port }}/health"
        method: GET
        timeout: 5
      delegate_to: localhost
      register: provision_busy_check
      failed_when: false
      changed_when: false

    - name: REFUSE to provision underneath a capture
      # A HARD FAIL for the whole play, where `sleep.yml` merely SKIPS the busy box — and the difference is
      # the point rather than an inconsistency. A partially-slept fleet is harmless: some boxes are off,
      # some are on, and nothing about the evidence changes. A partially-PROVISIONED fleet is the exact
      # INCONSISTENT state that stops every capture run, because `provisionRevision` would then differ
      # across boxes. Skipping the busy one is the worst available option here.
      #
      # A box that is not answering is NOT a refusal: it is asleep or being rebuilt, and provisioning is
      # how you would fix it. Only a live worker reporting `busy` blocks.
      when: provision_busy_check.json.busy | default(false) | bool
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is CAPTURING right now. Provisioning it would restart the worker
          mid-capture — 12–520 s of screen-reader work with no way to resume it — and would move
          provisionRevision on this box and not the others, which is a capture cache key and a
          fleet-consistency field. The fleet would then read INCONSISTENT and every capture run would
          refuse to start. Nothing has been changed. Stop the run first (`npm run lab:stop -- -e job=<name>`,
          or `npm run lab:status` to see what is going), then provision the WHOLE fleet together.

    - name: Fast-forward the guest checkout so the role acts on THIS version
      # The role installs from the repo on the box: npm, guidepup and the scheduled-task command lines
      # all point into it. Provisioning from a stale checkout would configure a worker to run code
      # nobody deployed, and only /health.code would notice.
      ansible.windows.win_shell: |
        git fetch --quiet origin
        git merge --ff-only --quiet origin/{{ a11y_git_ref | default('main') }}
        git rev-parse --short HEAD
      args:
        chdir: "{{ a11y_repo_path }}"
      register: role_head
      changed_when: true

    - name: Say which version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} provisioning from {{ role_head.stdout | trim }}"

  roles:
    - role: worker
      vars:
        worker_repo_path: "{{ a11y_repo_path }}"
        worker_task_name: "{{ a11y_task_name }}"
        worker_port: "{{ a11y_port }}"
