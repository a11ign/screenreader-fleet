---
# Update every worker to this checkout, and PROVE it took.
#
#     ansible-playbook deploy.yml
#     ansible-playbook deploy.yml -l a11y-worker-3
#
# ## The hole this closes
#
# `worker:deploy` is `utmctl file push` plus a `utmctl` reboot, keyed on a VM UUID. It has no host
# parameter and fails immediately off macOS, so a bare-metal worker had no code-delivery mechanism except a
# human opening an elevated PowerShell on the box. At one machine that is tedious; at twelve it means the
# fleet drifts, and drift here is not cosmetic — `environmentKey()` puts browser and OS versions in the
# capture cache key, so a split fleet fragments the corpus and, per fleet-consistency.mjs, "the cache merely
# stopped hitting, which reads as ordinary churn rather than as a split fleet."
#
# ## Pull, not push
#
# The guests are git-cloned (see code-version.mjs), so a deploy is a `git pull` on the box rather than
# eighteen file copies from the control plane. That is fewer moving parts and it makes rollback the same
# operation as deployment: check out the ref you want and run this again.
#
# ## Verification does not share a failure mode with the action
#
# Ansible acts over SSH; this verifies over HTTP. That is deliberate and this repo learned it expensively:
# the old advice was to hash-check both sides, but reading the guest's hash went through `utmctl exec` too,
# so when `exec` was broken the check returned EMPTY rather than MISMATCHED — and empty reads as a flaky
# tool rather than a failed deploy. `/health.code` is served on the channel the worker is actually used on,
# which is reachable exactly when it is useful.
- name: Deploy the worker code to the fleet
  hosts: a11y_workers
  gather_facts: false
  vars:
    a11y_repo_root: "{{ playbook_dir }}/../../.."

  pre_tasks:
    - name: Work out the code version this checkout expects
      # Computed by the SAME function the worker runs (`codeVersion`, which normalises CRLF), because a
      # second implementation is a second chance for the two sides to disagree. A git-cloned Windows guest
      # checks the files out with CRLF, and a byte-for-byte hasher therefore never matched it: measured
      # 31979b551b7a2cfa against this checkout's 22822b7a3a08969c, which read as "permanently stale".
      #
      # Imported BY PATH, not as `@a11y-witness/nvda-worker`. The package name needs npm workspace
      # resolution, which would mean 100 MB of node_modules on the fleet-control container -- the box
      # that holds the SSH key able to reconfigure every worker. It does not need a dependency tree, and
      # putting the largest supply-chain surface in the system next to that credential is the coupling
      # this split exists to remove (ADR 0012).
      #
      # Still the ONE hasher: code-version.mjs imports nothing but node stdlib and its sibling
      # worker-files.mjs, so a path import is the same function, and code-version.test.ts still forbids
      # a second copy. Verified identical: d1c98aa032198754 either way.
      ansible.builtin.command:
        cmd: >-
          node --input-type=module -e 'const m = await import("./packages/nvda-worker/src/code-version.mjs");
          process.stdout.write(m.codeVersion(m.workerSourceDir()))'
        chdir: "{{ a11y_repo_root }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: expected_code

    - name: Say which version is being deployed
      ansible.builtin.debug:
        msg: "deploying code version {{ expected_code.stdout }}"
      run_once: true

  tasks:
    # A GUEST THAT IS STILL COMING BACK IS NOT AN UNREACHABLE ONE, and this play could not tell them
    # apart. It reboots every guest it deploys to, so running two deploys in succession — or deploying
    # after any other operation that rebooted a box — meets a machine that is up but not yet answering
    # ssh, and Ansible reports UNREACHABLE at the first task. Measured 2026-08-26 across four separate
    # runs: one to four boxes dropped each time, every one of them healthy minutes later, and each
    # failure read as a fleet problem rather than as timing.
    #
    # A Windows guest takes a couple of minutes to come back, so the wait is generous; a box that is
    # genuinely off still fails, just after saying it waited rather than at the first packet.
    - name: Wait for the guest to be reachable at all
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10

    - name: Fetch and fast-forward the guest checkout
      # --ff-only, so a guest that somebody committed on fails loudly here instead of silently diverging
      # from the fleet and producing evidence under a code version nothing else has.
      #
      # IT DID NOT FAIL LOUDLY, AND THAT COMMENT WAS THE ONLY PLACE THE GUARANTEE EXISTED. PowerShell does
      # not abort on a failed NATIVE command, so a `checkout` that cannot find the branch and a `merge`
      # that cannot fast-forward both carried on to `git rev-parse`, which succeeded — and
      # `changed_when: true` then reported "changed" whatever had happened. Measured 2026-08-26: five
      # guests reported `changed` on every deploy while sitting on `main`, serving 0e91c290cc1f1ea0
      # against a checkout of 1204c829ff371a12, through a restart AND a reboot. The verify step caught
      # the SYMPTOM every time and named the wrong cause — "the files on the box are not the ones you
      # think" — because the step that was supposed to put them there had already reported success.
      #
      # `$LASTEXITCODE` after each git call is what makes the intent real: PowerShell's own
      # `$ErrorActionPreference` does not cover native executables, which is exactly the trap here.
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        function Run($what) { & git @args; if ($LASTEXITCODE -ne 0) { throw "git $what failed with $LASTEXITCODE" } }
        Run "fetch" fetch --quiet origin
        # A WORKER IS AN APPLIANCE: git is the source of truth there and nothing is authored on a guest,
        # so a modified TRACKED file is dirt and it blocks every fast-forward for ever. Measured
        # 2026-08-26: `packages/scorer/bin/fetch-encoder.mjs` was modified on all five boxes, so every
        # deploy since had aborted its merge and reported success anyway.
        #
        # REPORTED before it is discarded, and only tracked files — the same containment `lab:reset`
        # uses, for the opposite reason. On the LAB a dirty file may be work that exists nowhere else and
        # is refused; on a WORKER it cannot be, so it is named and cleared rather than blocking the fleet.
        # Untracked files are never touched.
        $dirty = git status --porcelain --untracked-files=no
        if ($dirty) { Write-Output "discarding local modifications on this guest:"; Write-Output $dirty; Run "checkout" checkout -- . }
        Run "checkout" -c advice.detachedHead=false checkout --quiet {{ a11y_git_ref | default('main') }}
        Run "merge" merge --ff-only --quiet origin/{{ a11y_git_ref | default('main') }}
        git rev-parse HEAD
      args:
        chdir: "{{ a11y_repo_path }}"
      register: guest_head
      changed_when: true

    - name: The guest is ON the commit it was told to be on
      # ASSERTED, not assumed from the step above having exited 0. Verification that shares a failure mode
      # with the action verifies nothing, and this repo has paid for that rule twice already — reading a
      # guest's hash through the same `exec` that was broken returned EMPTY rather than MISMATCHED.
      ansible.builtin.assert:
        that: guest_head.stdout_lines | last | trim == a11y_expected_commit
        fail_msg: >-
          {{ inventory_hostname }} is on {{ guest_head.stdout_lines | last | trim }}, not
          {{ a11y_expected_commit }}. The fetch reported success, so this is the checkout or the
          fast-forward being refused — usually a guest committed on locally, or the branch does not
          exist there. `git -C {{ a11y_repo_path }} status` on the box says which.

    - name: Install dependencies
      # Unconditional and idempotent. Skipping it when package-lock.json looks unchanged is the
      # optimisation that leaves one box on last week's guidepup — and guidepup's version is EVIDENCE,
      # in the capture cache key, because it parses NVDA's speech before this project sees it.
      #
      # `--omit=dev` is GONE, and it is what stopped this playbook working at all. `packages/worker-fleet`
      # declares `"prepare": "tsc --build"`, and `typescript` is a devDependency — so omitting dev
      # dependencies removes the compiler that the install itself then tries to run:
      #
      #   npm error command cmd.exe /d /s /c tsc --build
      #   npm error 'tsc' is not recognized as an internal or external command
      #
      # It failed on all four workers on its first real use. Nobody had seen it because deploying worker
      # code needs a fleet to deploy to, and until this week there was one box that had never been
      # successfully provisioned.
      #
      # The flags now MATCH `roles/worker/tasks/nvda.yml` exactly, deliberately. Two paths running the
      # same operation with different arguments is how one of them quietly stops working while the other
      # keeps proving nothing is wrong.
      ansible.windows.win_shell: npm install --prefer-offline --no-audit --no-fund
      args:
        chdir: "{{ a11y_repo_path }}"
      changed_when: true

    - name: Restart the worker task
      ansible.builtin.import_tasks: tasks/restart-worker.yml

    - name: Confirm the worker is serving THIS checkout
      ansible.builtin.import_tasks: tasks/verify-code.yml

  post_tasks:
    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} at {{ guest_head.stdout | trim }} serving
          {{ served_code }} (expected {{ expected_code.stdout }})
