---
# Power, NIC and browser-profile state.
#
# Every task here was checked for a first-class module and has none: `win_power_plan` selects a PLAN
# rather than individual AC timeouts, nothing exposes NIC selective-suspend, and there is no Defender
# module in either collection (the only one anywhere is a lone third-party repo).
#
# "No module exists" is NOT the same as "this must be inline script", which is where this file started.
# They are `a11y.worker` modules now — our own, built on Ansible.Basic — so each one reads current state,
# changes only the difference, honours `--check`, and reports a diff. Inline `win_powershell` could do
# none of that: it receives `$Ansible.CheckMode` and it was on us to read it, which we did not.

- name: Never sleep, on AC
  # A worker that sleeps is a worker that has vanished. On the first physical box it presented as
  # EHOSTUNREACH for 48 consecutive requests in one evidence-check run, then answered a curl thirty
  # seconds later — which reads as a flaky network rather than as power management.
  #
  # AC only, deliberately: a laptop-class worker sleeping on battery is correct behaviour.
  #
  # The module reads the active scheme's current values before acting, because `powercfg /change` exits 0
  # whether or not anything moved — so `changed` used to be a guess.
  become: true
  a11y.worker.a11y_power_timeouts:

# Intel's own NIC driver, and it must come BEFORE the two tasks below, because both of them configure a
# capability the inbox driver does not have.
#
# Windows ships `e1i68x64.sys` (provider: Microsoft, 2021) for the I219. It gives full connectivity — a box
# installs, bootstraps and serves captures on it perfectly — and it cannot wake. It exposes exactly ONE
# advanced property, `Speed & Duplex`, and `Get-NetAdapterPowerManagement` answers
# `WakeOnMagicPacket: Unsupported`. Intel's `e1d.sys` exposes 37 of them, including `Wake on Magic Packet`.
#
# That is why this was so expensive to find: every check said the box was healthy, because it WAS healthy.
# `PnPCapabilities` had the right value, the BIOS had Wake on LAN enabled, the NIC appeared in
# `powercfg -devicequery wake_armed` — and the packet still landed on an adapter with no wake support.
#
# The driver is committed under `files/intel-e1d` (~1 MB, from Intel's Wired_driver_31.2.2_x64 pack)
# rather than downloaded: intel.com serves 403 to anything that is not a browser, so a provisioning run
# that fetched it would work by hand and fail unattended.
- name: What NIC is this, and whose driver is on it
  # The hardware ID as well as the provider, because gating on the provider alone would try to install an
  # Intel driver onto the fleet's Realtek box: "not Intel" is true of a Realtek adapter too. That would
  # stage a non-matching driver and then fail the assert below on a machine with nothing wrong with it.
  become: true
  ansible.windows.win_shell: |
    $a = Get-NetAdapter -Physical | Select-Object -First 1
    $ids = (Get-PnpDeviceProperty -InstanceId $a.PnPDeviceID -KeyName DEVPKEY_Device_HardwareIds -EA SilentlyContinue).Data
    "$($a.DriverProvider)|$($a.DriverFileName)|$($ids -join ',')"
  changed_when: false
  register: nic_driver

- name: Note a NIC this role has no driver for
  # Said out loud rather than skipped silently. A box whose wake support is unknown is a box that will
  # look fine until the day nothing wakes it.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has a non-Intel NIC ({{ nic_driver.stdout | trim }}). The Intel driver step
      does not apply; whether this adapter can wake is UNVERIFIED and wake.yml may not work on it.
  when: "'VEN_8086' not in nic_driver.stdout"

- name: Stage Intel's driver
  become: true
  ansible.windows.win_copy:
    src: "intel-e1d/{{ item }}"
    dest: 'C:\a11y\intel-e1d\{{ item }}'
  loop: [e1d.inf, e1d.sys, e1d.cat, e1dmsg.dll]
  when: "'VEN_8086' in nic_driver.stdout and 'Intel' not in nic_driver.stdout"

- name: Install it
  # Fire-and-forget, because installing a NIC driver re-initialises the adapter and therefore drops the
  # very SSH connection Ansible is issuing this over. Waiting for it synchronously reports UNREACHABLE on
  # a task that actually succeeded.
  become: true
  ansible.windows.win_command: pnputil.exe /add-driver C:\a11y\intel-e1d\e1d.inf /install
  async: 180
  poll: 0
  when: "'VEN_8086' in nic_driver.stdout and 'Intel' not in nic_driver.stdout"

- name: Wait for the box to come back after the adapter re-initialises
  ansible.builtin.wait_for_connection:
    delay: 20
    timeout: 300
  when: "'VEN_8086' in nic_driver.stdout and 'Intel' not in nic_driver.stdout"

- name: Prove the driver actually changed
  # Asserted, not assumed. `pnputil` exits 0 for "staged in the driver store" as well as "installed on the
  # device", and the difference is invisible until something needs to wake.
  become: true
  ansible.windows.win_shell: |
    $a = Get-NetAdapter -Physical | Select-Object -First 1
    "$($a.DriverProvider)|$($a.DriverVersion)|$($a.DriverFileName)"
  changed_when: false
  register: nic_driver_after

- name: Refuse to call this provisioned if the adapter still cannot wake
  ansible.builtin.assert:
    that: "'Intel' in nic_driver_after.stdout"
    fail_msg: >-
      {{ inventory_hostname }} still reports NIC driver {{ nic_driver_after.stdout | trim }}. Microsoft's
      inbox driver has NO wake support, so wake.yml cannot work on this box however the BIOS and
      PnPCapabilities are set.
    success_msg: "NIC driver is {{ nic_driver_after.stdout | trim }}"
  when: "'VEN_8086' in nic_driver.stdout"

- name: Turn the wake properties on
  # Only exist once Intel's driver is in place. Energy Efficient Ethernet takes Off/On rather than
  # Disabled/Enabled, which is why it is listed separately — setting it wrongly fails the task rather than
  # silently leaving a documented WoL blocker enabled.
  become: true
  ansible.windows.win_shell: |
    $a = (Get-NetAdapter -Physical | Select-Object -First 1).Name
    foreach ($p in @(@('Wake on Magic Packet','Enabled'), @('Wake on Pattern Match','Enabled'),
                     @('Reduce Speed On Power Down','Disabled'), @('Energy Efficient Ethernet','Off'))) {
      try { Set-NetAdapterAdvancedProperty -Name $a -DisplayName $p[0] -DisplayValue $p[1] -EA Stop }
      catch {
        # Not every property exists on every adapter model, and a missing one is not a failure here --
        # what matters is the single value read below, which `failed_when` gates on. Swallowing these
        # individually is only safe BECAUSE the outcome is asserted rather than assumed.
      }
    }
    (Get-NetAdapterPowerManagement -Name $a).WakeOnMagicPacket
  register: wake_prop
  changed_when: false
  failed_when: "'Enabled' not in wake_prop.stdout"
  # Intel hardware only. These property NAMES are Intel's; a Realtek adapter has its own, and failing a
  # box for not answering to them would be the check inventing a fault rather than finding one.
  when: "'VEN_8086' in nic_driver.stdout"

- name: Keep the NIC awake
  # The SECOND mechanism, and fixing only one leaves the fault intermittent: the sleep timers put the
  # whole machine away, while selective suspend powers the adapter down with the OS still running.
  #
  # The module fails when no physical adapter is Up rather than reporting ok having adjusted nothing.
  become: true
  a11y.worker.a11y_nic_power:

- name: Reclaim Defender's memory, if Tamper Protection allows it
  # Reported, not fought. Tamper Protection SILENTLY REVERTS Set-MpPreference — the call succeeds, the
  # setting appears to change, and Defender puts it back — so a task that claimed `changed` there would
  # be lying on every run. The module checks first and says so, and deliberately does not fail: the box
  # is still a usable worker, it just costs the ~242 MB.
  become: true
  a11y.worker.a11y_defender:
  register: defender

- name: Say what Defender did
  ansible.builtin.debug:
    msg: "{{ defender.msg | default('real-time monitoring off') }}"

- name: Durable browser capture profiles
  # `browsers.mjs` defaults these under %LOCALAPPDATA%, one directory PER BROWSER. Provisioning
  # preparing one path while the worker uses another leaves a FIRST-RUN browser, which NVDA records as
  # phantom elements on pages with no headings. They must not sit in %TEMP%, for the same reason the
  # NVDA install must not.
  #
  # Unbecomed: %LOCALAPPDATA% is per-user and the worker is `witness`.
  #
  # Both are created regardless of which browser this guest drives — they cost an empty directory, and a
  # guest whose browser is switched later should not need re-provisioning to get a prepared profile.
  ansible.windows.win_file:
    path: '%LOCALAPPDATA%\a11y-witness\{{ item }}'
    state: directory
  loop:
    - edge-profile
    - chrome-profile
