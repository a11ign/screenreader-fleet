---
# ONE EDGE BUILD ACROSS THE FLEET, installed deliberately and held there.
#
# `browserVersion` is part of the capture cache key, for the documented reason that a fleet can run more
# than one browser. So a guest that updates itself stops being interchangeable with its neighbours: two
# builds must never write into one corpus, and a split shows up first as unexplained cache misses.
#
# ## Why the policy in policy.yml is not the mechanism
#
# Microsoft documents twelve EdgeUpdate policies -- `UpdateDefault`, the per-app `Update{56EB18F8-...}` and
# `TargetVersionPrefix{...}` among them -- as "available only on Windows instances that are joined to a
# Microsoft Active Directory domain". These boxes are standalone, so those values are stored and never
# honoured. Provisioning set them, this role read them back correctly, and a11y-worker-2 updated itself
# anyway. A read-back that can only prove a value is STORED is not proof that anything obeys it.
#
# Hence: install the build we want, and stop the updater by the two levers that do work here.

- name: What Edge is actually installed
  # From the binary, never from the registry's "installed version" -- the same rule the worker itself now
  # follows after reporting a version it was not running for five days.
  become: true
  ansible.windows.win_powershell:
    parameters:
      Exe: "{{ worker_edge_exe }}"
    script: |
      param($Exe)
      $Ansible.Changed = $false
      if (Test-Path -LiteralPath $Exe) { (Get-Item -LiteralPath $Exe).VersionInfo.ProductVersion } else { "" }
  changed_when: false
  # ALWAYS run, even under --check. This is a read, and a dry run that cannot see the installed version
  # cannot tell you what it would do: `win_powershell` tasks do not execute in check mode, so without this
  # the version came back empty, nothing matched, and `--check` reported it would reinstall Edge on the one
  # box already running the pinned build. A dry run whose answer is wrong is worse than no dry run.
  check_mode: false
  register: edge_installed

- name: What it would do
  # Said out loud so `--check` is legible: "changed" on the install tasks below is the interesting part, and
  # a run that skips them everywhere is the steady state rather than a no-op.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Edge {{ edge_installed.output | default([]) | first | default('(absent)', true) }}
      {{ '— already the pinned build' if (edge_installed.output | default([]) | first | default('', true)) == worker_edge_version
         else '— would install ' ~ worker_edge_version }}

- name: Fetch the pinned installer
  # Only when it would change something: this is a ~150 MB download onto a box that may be mid-corpus.
  when: (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
  become: true
  ansible.windows.win_get_url:
    url: "{{ worker_edge_msi_url }}"
    dest: "{{ worker_edge_msi_path }}"
    checksum: "{{ worker_edge_msi_sha256 }}"
    checksum_algorithm: sha256
    # A version claim that rests on a hostname is not a version claim. The checksum is what makes
    # "the fleet runs 151.0.4129.101" a fact rather than a hope.
    force: false

- name: Refuse to upgrade a worker that is mid-capture
  # Installing means stopping Edge, and stopping Edge under a running capture destroys 12-520 s of real
  # screen-reader work and writes a fault the run reads as a flaky guest. `ready` is the field to ask --
  # `ok` only ever meant "the HTTP server is answering".
  when: (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8765/health"
    return_content: true
  register: edge_worker_health
  failed_when: edge_worker_health.json.busy | default(true)

- name: Stop Edge, or the installer cannot replace the launcher
  # THE REASON THIS TASK EXISTS, measured on a11y-worker-3: `win_package` reported success, the version
  # directory 151.0.4129.101 was created, and `msedge.exe` stayed at .93 -- because 8 msedge processes were
  # holding it. The worker keeps a browser alive between captures on purpose (`A11Y_REUSE_BROWSER`, which
  # took `windowsActivate` from 8.9 s to 3.6 s), so an idle worker still has Edge running.
  #
  # An install that reports success and changes nothing is the worst outcome available here: it is the
  # "green result vouching for an inert remedy" shape, applied to the browser the whole corpus is keyed on.
  when: (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
  become: true
  ansible.windows.win_shell: taskkill /im msedge.exe /f
  failed_when: false   # "not found" is success here; the verify at the end is the judge
  changed_when: true

- name: Refuse a DOWNGRADE, and say which of the two remedies applies
  # EDGE CANNOT BE DOWNGRADED ON THIS FLEET, and pretending otherwise cost two runs to establish.
  # Measured on a11y-worker-5, 2026-08-25, in this order:
  #
  #   Edge had auto-updated to .107 against a pin of .101
  #   win_package ran the .101 MSI and reported ok — no .101 directory appeared, because Chromium's
  #     installer declines to install over a newer build
  #   setup.exe --uninstall --system-level --force-uninstall reported an exit code and removed NOTHING;
  #     .107 was still the only build on disk afterwards. Windows blocks uninstalling Edge outside the
  #     EEA, so this is a platform decision rather than a flag we are missing.
  #
  # So the role cannot fix a forward drift, and the honest thing is to say so with the remedies rather
  # than fail on a confusing symptom ("the MSI did not lay down 151.0.4129.101", which is true and does
  # not explain itself). Both remedies are decisions a person has to make:
  #
  #   REIMAGE the guest, which is destructive and restores the pin; or
  #   MOVE THE PIN forward to the newer build — which invalidates every cached corpus capture, because
  #     `worker_edge_version` is part of the capture cache key.
  #
  # Meanwhile nothing silently contaminates a corpus: `capture-real-pages.mjs` refuses to run across a
  # fleet whose browsers disagree, checked before the run AND after it.
  when:
    - (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
    - (edge_installed.output | default([]) | first | default('0', true)) is version(worker_edge_version, '>')
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is on Edge {{ edge_installed.output | default([]) | first | default('?', true) }},
      NEWER than the pinned {{ worker_edge_version }}. Chromium will not install over a newer build and
      Windows will not let it be uninstalled, so this role cannot bring it back. Either reimage this guest,
      or move `worker_edge_version` to the newer build and accept that every cached corpus capture is
      invalidated — `browserVersion` is part of the capture cache key. Until then a capture run will refuse
      to use this fleet, which is the behaviour you want.

- name: Install it
  when: (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
  become: true
  ansible.windows.win_package:
    path: "{{ worker_edge_msi_path }}"
    state: present
    arguments: /quiet /norestart
  register: edge_installed_now

- name: Complete the launcher rename, which is what actually makes the new build the running one
  # THE STEP THIS ROLE WAS MISSING, and it is not a workaround -- it is how Chromium installs work.
  #
  # The MSI stages the new launcher beside the old one as `new_msedge.exe` and leaves `msedge.exe` alone,
  # because the running browser holds it. The rename is a SEPARATE operation performed later by the Edge
  # updater -- which this role has just disabled, permanently and on purpose. So on this fleet nothing was
  # ever going to finish the install.
  #
  # Measured on a11y-worker-3, in this order, and the first two are why the comment is this long:
  #
  #   win_package                 reported success; msedge.exe stayed at .93, new_msedge.exe appeared
  #   a full reboot               did NOT complete it -- so it is not a pending-file-rename
  #   setup.exe --rename-chrome-exe --system-level    exit 0, msedge.exe became .101
  #
  # `pv` in Edge's own ClientState already read 151.0.4129.101 while the binary read .93, so the vendor's
  # bookkeeping and the file on disk disagreed -- the same shape as the worker reporting a version it was
  # not running. Trust the binary.
  #
  # Run unconditionally when the version is still wrong, NOT gated on `install is changed`: once the MSI has
  # been installed by an earlier attempt, `win_package` is a no-op and reports unchanged, which is exactly
  # how the second run left the box on the old build while claiming to have done its job.
  when: (edge_installed.output | default([]) | first | default('', true)) != worker_edge_version
  become: true
  ansible.windows.win_shell: |
    taskkill /im msedge.exe /f 2>$null | Out-Null
    Start-Sleep -Seconds 3
    $setup = "{{ worker_edge_dir }}\{{ worker_edge_version }}\Installer\setup.exe"
    if (-not (Test-Path -LiteralPath $setup)) { throw "no installer at $setup — the MSI did not lay down {{ worker_edge_version }}" }
    $p = Start-Process -FilePath $setup -ArgumentList "--rename-chrome-exe","--system-level" -Wait -PassThru -NoNewWindow
    if ($p.ExitCode -ne 0) { throw "rename-chrome-exe exited $($p.ExitCode)" }
  changed_when: true

- name: Stop and disable EVERY Edge-updater scheduled task
  # BY PREFIX, NOT BY NAME. The first version named the two tasks that were known -- Core and UA -- and a
  # freshly installed guest turned out to carry a third, `MicrosoftEdgeUpdateBrowserReplacementTask`, sitting
  # `Ready` while the other two were correctly disabled. A task called "browser replacement" is precisely the
  # thing this concern exists to stop, and an enumerated list could not see it.
  #
  # Same shape as `edgePolicy` reporting two policy values, and as the probe flags that had to be forwarded
  # by prefix rather than by name. When the set can grow underneath you, match the set.
  become: true
  ansible.windows.win_shell: |
    $tasks = Get-ScheduledTask -TaskName 'MicrosoftEdgeUpdate*' -ErrorAction SilentlyContinue
    if (-not $tasks) { "none found"; exit 0 }
    foreach ($t in $tasks) {
      if ($t.State -ne 'Disabled') { Disable-ScheduledTask -TaskName $t.TaskName -TaskPath $t.TaskPath | Out-Null }
      "$($t.TaskName) -> $((Get-ScheduledTask -TaskName $t.TaskName -TaskPath $t.TaskPath).State)"
    }
  changed_when: true

- name: Stop and disable the updater's services
  become: true
  ansible.windows.win_service:
    name: "{{ item }}"
    state: stopped
    start_mode: disabled
  loop: "{{ worker_edge_updater_services }}"
  failed_when: false

- name: Refuse to call this provisioned unless Edge is the pinned build and the updater is off
  # The "prove it" half, matching every other concern in this role. Read back from the binary and from the
  # live task/service state -- never from the variables we just wrote, which would assert our own intent.
  become: true
  ansible.windows.win_powershell:
    parameters:
      Exe: "{{ worker_edge_exe }}"
      Want: "{{ worker_edge_version }}"
      Tasks: "{{ worker_edge_updater_tasks }}"
      Services: "{{ worker_edge_updater_services }}"
    script: |
      param($Exe, $Want, $Tasks, $Services)
      $Ansible.Changed = $false
      $wrong = @()
      $have = if (Test-Path -LiteralPath $Exe) { (Get-Item -LiteralPath $Exe).VersionInfo.ProductVersion } else { "(absent)" }
      if ($have -ne $Want) { $wrong += "Edge is $have, expected $Want" }
      # Enumerated, not looked up by name -- and it must be, because the fault this catches is a task nobody
      # listed. The old form asked after two known names and would have passed vacuously on a guest carrying a
      # third: `$task -and ...` reads an ABSENT task as compliant.
      foreach ($task in @(Get-ScheduledTask -TaskName 'MicrosoftEdgeUpdate*' -ErrorAction SilentlyContinue)) {
        if ($task.State -ne 'Disabled') { $wrong += "scheduled task $($task.TaskName) is $($task.State), expected Disabled" }
      }
      foreach ($s in $Services) {
        $svc = Get-Service -Name $s -ErrorAction SilentlyContinue
        if ($svc) {
          if ($svc.Status -ne 'Stopped') { $wrong += "service $s is $($svc.Status), expected Stopped" }
          if ($svc.StartType -ne 'Disabled') { $wrong += "service $s start type is $($svc.StartType), expected Disabled" }
        }
      }
      if ($wrong.Count) { throw ($wrong -join '; ') }
      "Edge $have, updater disabled"
  register: edge_proof

- name: Say what it is on
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ edge_proof.output | first | default('unknown') }}"
