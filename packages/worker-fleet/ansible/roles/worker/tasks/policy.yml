---
# Machine and user policy: keep the desktop silent and the browser predictable.
#
# This is what `normalise-fleet.mjs` + `guest/normalise-fleet.cmd` did, except that pair could only ever
# reach UTM guests -- it enumerated VMs from `utmctl list` and pushed a .cmd through a bespoke 150-line
# remote-exec transport. Bare-metal workers had no equivalent at all, which is how a fleet drifts.
#
# Drift here is not cosmetic. `environmentKey()` puts browser and OS versions in the CAPTURE CACHE KEY,
# and fleet-consistency.mjs records how a split fleet presents: "the cache merely stopped hitting, which
# reads as ordinary churn rather than as a split fleet."
#
# ## The HKLM / HKCU split is load-bearing
#
# Elevated tasks below are `become: true`, which runs as SYSTEM. The HKCU tasks deliberately are NOT:
# an SSH session is already `witness`, so unbecomed tasks write the worker's own hive. Becoming SYSTEM
# for these would write SYSTEM's HKCU instead -- the screensaver would stay on for the account that
# actually runs captures, and nothing would report a thing. That is precisely the defect the previous
# `become: true` on the whole script introduced.

# These three used `win_regedit` with `loop:`, which is ONE SSH ROUND TRIP PER VALUE. Measured with
# profile_tasks on a11y-worker-4: 42.95s, 12.23s and 24.44s — about 79s of a run whose top twenty tasks
# totalled 245s, to write a dozen DWORDs. The work is trivial; the transport is the cost.
#
# Batched into one call each. `win_regedit`'s idempotency, check-mode and diff are the reason CLAUDE.md
# argues against replacing modules with inline script, so those properties are kept by hand rather than
# dropped: the script reads current state, writes only differences, honours `$Ansible.CheckMode`, and
# sets `$Ansible.Changed` from what it actually did. The values it changed are returned so the run still
# says which ones moved.
#
# And it is ASSERTED afterwards, because this is the one place where a silent miss would be expensive:
# the header above notes drift here reaches `environmentKey()` and therefore the CAPTURE CACHE KEY. A
# batched write that quietly skipped a value would be evidence corruption, not a slow run.
- name: Edge policy — first run, background work, and autofill
  become: true
  ansible.windows.win_powershell:
    parameters:
      Path: 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
      Values: "{{ worker_edge_policy }}"
    script: &apply_dwords |
      param($Path, $Values)
      $changed = @()
      foreach ($v in $Values) {
        # Per-item path wins, so a list whose entries carry their own key works through the same script.
        $p = if ($v.path) { $v.path } else { $Path }
        if (-not (Test-Path -LiteralPath $p)) {
          if (-not $Ansible.CheckMode) { New-Item -Path $p -Force | Out-Null }
          $changed += "$p (key created)"
        }
        $cur = $null
        try { $cur = (Get-ItemProperty -LiteralPath $p -Name $v.name -ErrorAction Stop).($v.name) } catch { $cur = $null }
        if ($null -eq $cur -or [int]$cur -ne [int]$v.value) {
          if (-not $Ansible.CheckMode) {
            New-ItemProperty -LiteralPath $p -Name $v.name -Value ([int]$v.value) -PropertyType DWord -Force | Out-Null
          }
          $changed += "$($v.name)=$($v.value)"
        }
      }
      $Ansible.Changed = $changed.Count -gt 0
      $changed

- name: Edge auto-update off
  become: true
  ansible.windows.win_powershell:
    parameters:
      Path: 'HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate'
      Values: "{{ worker_edge_update_policy }}"
    script: *apply_dwords

- name: Nothing pops to the foreground uninvited
  become: true
  ansible.windows.win_powershell:
    parameters:
      Path: ''
      Values: "{{ worker_quiet_policy }}"
    script: *apply_dwords

- name: Refuse to call this provisioned if a policy value did not land
  # Read back, in one call. The batched writes above are only safe BECAUSE this exists: a loop of
  # `win_regedit` fails loudly on the value it could not write, and a batched script could not without
  # being asked. This is the "prove it" half that every other guard in this role has.
  become: true
  ansible.windows.win_powershell:
    parameters:
      EdgePath: 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
      UpdatePath: 'HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate'
      Edge: "{{ worker_edge_policy }}"
      Update: "{{ worker_edge_update_policy }}"
      Quiet: "{{ worker_quiet_policy }}"
    script: |
      param($EdgePath, $UpdatePath, $Edge, $Update, $Quiet)
      $Ansible.Changed = $false
      $wrong = @()
      function Check($p, $name, $want) {
        $cur = $null
        try { $cur = (Get-ItemProperty -LiteralPath $p -Name $name -ErrorAction Stop).($name) } catch { $cur = $null }
        if ($null -eq $cur -or [int]$cur -ne [int]$want) { return "$p\$name is '$cur', wanted '$want'" }
        return $null
      }
      foreach ($v in $Edge)   { $r = Check $EdgePath   $v.name $v.value; if ($r) { $wrong += $r } }
      foreach ($v in $Update) { $r = Check $UpdatePath $v.name $v.value; if ($r) { $wrong += $r } }
      foreach ($v in $Quiet)  { $r = Check $v.path     $v.name $v.value; if ($r) { $wrong += $r } }
      if ($wrong.Count -gt 0) {
        $Ansible.Failed = $true
        "policy values did not land: " + ($wrong -join '; ')
      } else {
        "all $($Edge.Count + $Update.Count + $Quiet.Count) policy values verified"
      }

# --- HKCU from here down. NO `become` — see the header. ---

- name: Suggestion surfaces off for the worker's own account
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager
    name: "{{ item }}"
    data: 0
    type: dword
  loop: "{{ worker_content_delivery_values }}"
  loop_control:
    label: "{{ item }}"

- name: Screensaver off
  # It can take the foreground mid-capture and steal focus from the browser. String values, not DWORDs:
  # this is where Windows has always kept them, and a DWORD here is silently ignored.
  ansible.windows.win_regedit:
    path: HKCU:\Control Panel\Desktop
    name: "{{ item }}"
    data: "0"
    type: string
  loop:
    - ScreenSaveActive
    - ScreenSaveTimeOut

# The policy above stops OneDrive starting again. It does NOT remove the per-user Run entry that
# relaunches it at logon, and it does not dismiss a toast already on screen — observed, with the policy
# applied cleanly and "Turn On Windows Backup" still sitting over the desktop.
- name: Remove OneDrive's per-user Run entries
  ansible.windows.win_regedit:
    path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Run
    name: "{{ item }}"
    state: absent
  loop:
    - OneDrive
    - OneDriveSetup

- name: Evict OneDrive itself
  # Policy stops it STARTING again; it does not remove the Run entry above, and it does not dismiss a
  # toast already on screen — observed, with the policy applied cleanly and "Turn On Windows Backup"
  # still sitting over the desktop.
  a11y.worker.a11y_onedrive:
  register: onedrive_evicted

- name: Report the UAC posture, and do not change it
  # UAC prompts land on the secure desktop, where NVDA cannot read them and automation cannot click
  # them. The answer is to NEED no elevation at runtime, never to turn UAC off: guidepup drives
  # nvda_noUIAccess.exe, which cannot read elevated windows at all, so an elevated browser would
  # capture nothing. Reported so a surprising value is visible, and deliberately not written.
  become: true
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: PromptOnSecureDesktop
  register: uac_posture
  changed_when: false

- name: Say what it is
  ansible.builtin.debug:
    msg: >-
      PromptOnSecureDesktop={{ uac_posture.value | default('unset') }} —
      fine either way, because nothing in the capture path elevates.
      OneDrive: {{ onedrive_evicted.actions | default(['nothing to do']) | join(', ') }}
