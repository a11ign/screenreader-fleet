---
# The worker port, and the dialog that would otherwise block the whole desktop.

- name: No "allow this app" alerts
  # A program that starts listening with no matching rule raises the allow-app alert, and that alert
  # blocks the ENTIRE interactive session until someone dismisses it. On a headless fleet nobody will,
  # so the box sits there looking hung with a perfectly healthy worker behind a modal.
  #
  # `win_firewall` manages the profiles but exposes only inbound_action, outbound_action, profiles and
  # state -- NotifyOnListen is not among them -- so this stays a script. Verified against the installed
  # module rather than assumed.
  #
  # It reads before it writes, and it does not write under --check. `win_powershell` supports check mode
  # by handing $Ansible.CheckMode to the script; ACTING on it is the script's job, and not doing so is
  # what made `--check` on this role dangerous.
  become: true
  ansible.windows.win_powershell:
    script: |
      $before = (Get-NetFirewallProfile -Profile Domain, Private, Public).NotifyOnListen
      $Ansible.Changed = ($before -contains $true)
      if ($Ansible.Changed -and -not $Ansible.CheckMode) {
        Set-NetFirewallProfile -Profile Domain, Private, Public -NotifyOnListen False
      }
      "NotifyOnListen was: $($before -join ',')"

- name: Inbound rule for the worker port
  # Profile Any on purpose: a bare-metal box's NIC profile can flip between Private and Public after a
  # DHCP lease change or a network rename, and a rule bound to one profile then silently stops applying
  # — which presents as a worker that was reachable yesterday and is not today.
  become: true
  community.windows.win_firewall_rule:
    name: "a11y-witness worker {{ worker_port }}"
    localport: "{{ worker_port }}"
    protocol: tcp
    direction: in
    action: allow
    profiles: [domain, private, public]
    enabled: true
    state: present

- name: sshd will still be there after a reboot
  # NOT tautological, which is the only reason it earns a task.
  #
  # That Ansible reached this box proves sshd is RUNNING. It proves nothing about whether it will come
  # back: a service can be Running now and StartupType Manual, in which case the next reboot strands the
  # box with a perfectly healthy worker on :8765 and no way in. From outside that is indistinguishable
  # from a dead machine, and the repair is a console visit — which this fleet exists to avoid.
  #
  # `bootstrap-windows-worker.ps1` sets Automatic when it installs sshd, so this is drift detection rather
  # than setup. It cannot BE setup: the role is reached over the thing it would be configuring.
  #
  # Measured 2026-08-23 across all four workers: Status=Running, StartType=Automatic. Written after an
  # afternoon spent believing sshd had died on this fleet, when the real cause was an ACL that grants
  # tcp:8765 and not tcp:22 — so the check that would have settled it in one command did not exist.
  become: true
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started
  register: worker_sshd

- name: Say so
  ansible.builtin.debug:
    msg: >-
      sshd start_mode={{ worker_sshd.start_mode | default('auto') }}
      {{ 'CHANGED — it was not set to start on boot, and a reboot would have stranded this box'
         if worker_sshd.changed else '(already correct)' }}

- name: Inbound rule for SSH
  # Same Profile Any reasoning as the worker port above: a rule bound to one profile stops applying when
  # the NIC's network category flips, and management access is the worst thing to lose that way.
  become: true
  community.windows.win_firewall_rule:
    name: OpenSSH Server (a11y-witness)
    localport: 22
    protocol: tcp
    direction: in
    action: allow
    profiles: [domain, private, public]
    enabled: true
    state: present
