---
# Discard the lab checkout's uncommitted changes — but only ones already committed on origin.
#
#     npm run lab:reset                 # report what is dirty and whether it is safe to discard
#     npm run lab:reset -- -e apply=true
#
# ## Why this exists
#
# `promote:gated` runs on the lab, because that is the only box where the candidate weights and the code
# both exist, and it deliberately does not commit — promoting is a MAJOR release and a job that can push
# is a job that can release by accident. So it leaves modified weights in the lab's checkout.
#
# `run-job.yml` then refuses to pull into a dirty checkout, correctly: it cannot tell a stray artefact
# from somebody's work in progress. Measured 2026-08-26: every subsequent job was pinned to the commit
# from before the promotion, and the `gates` pipeline failed at stage 1 naming exactly that.
#
# The manual fix was `ssh root@... git checkout --`, which is the hand-crank this whole interface exists
# to remove — and a dangerous one, because a `git checkout --` on the wrong file destroys work with no
# undo. This project has already lost release-eligible weights to exactly that command.
#
# ## It REFUSES anything origin does not already have
#
# Every dirty path is compared against `origin/<ref>` before anything is discarded. A file whose working
# copy differs from what origin holds is somebody's unpushed work and is never touched — the play stops
# and names it. That is what makes this safe to run without reading the box first: the only thing it can
# throw away is a byte-for-byte copy of something already committed.
- name: Clean the lab checkout, safely
  hosts: a11y_lab
  gather_facts: false

  tasks:
    - name: A ref must look like a ref
      ansible.builtin.assert:
        that:
          - (ref | default('main')) is match('^[A-Za-z0-9._/-]{1,100}$')
          - "'..' not in (ref | default('main'))"
        fail_msg: "-e ref= must be a plain branch, tag or commit."

    - name: What is dirty
      ansible.builtin.command:
        argv: [git, status, --porcelain]
        chdir: "{{ lab_repo_path }}"
      register: dirty
      changed_when: false

    - name: Nothing to do
      when: (dirty.stdout | trim) == ''
      ansible.builtin.debug:
        msg: "{{ lab_repo_path }} is clean — nothing to discard."

    - name: Fetch origin, so the comparison is against what is really there
      when: (dirty.stdout | trim) != ''
      ansible.builtin.command:
        argv: [git, fetch, --quiet, origin]
        chdir: "{{ lab_repo_path }}"
      changed_when: false

    - name: Which DIRTY files differ from what origin holds
      # Restricted to the dirty paths, and that restriction is the whole correctness of this play.
      #
      # The first version ran `git diff --name-only origin/<ref>` with no paths, which compares the whole
      # tree — so it listed every file the lab has not PULLED yet and reported "1 dirty path; 1 differs"
      # while naming six. It then refused on `.changeset/promote-v15-scorer.md`, a file the lab has never
      # had and cannot be carrying work in. The counts disagreeing with the list is what gave it away.
      #
      # `-- <paths>` asks the question actually being asked: of the files that are dirty HERE, which hold
      # content origin does not have? A promoted artefact committed and pushed from a laptop does not
      # appear; genuinely unpushed work does.
      when: (dirty.stdout | trim) != ''
      ansible.builtin.shell:
        cmd: >-
          git status --porcelain | awk '{print $NF}' |
          xargs -r git diff --name-only origin/{{ ref | default('main') }} --
        chdir: "{{ lab_repo_path }}"
      register: unpushed
      changed_when: false
      failed_when: false

    - name: Say what was found
      when: (dirty.stdout | trim) != ''
      ansible.builtin.debug:
        msg: >-
          {{ (dirty.stdout | trim | split('\n') | length) }} dirty path(s);
          {{ (unpushed.stdout | trim | split('\n') | reject('equalto', '') | list | length) }}
          differ(s) from origin/{{ ref | default('main') }}.
          {{ 'SAFE to discard: every modified file matches what origin already has.'
             if (unpushed.stdout | trim) == ''
             else 'REFUSING: these carry work origin does not have — ' ~ (unpushed.stdout | trim) }}

    # What is left to refuse over, once the operator has NAMED something deliberately.
    #
    # `-e remove=` is this play's escape hatch and it was UNREACHABLE for the only file that ever needs
    # it: the refusal below runs first, so naming the very path causing the refusal still aborted before
    # the removal task. Measured 2026-08-26 on a stale changeset the lab had written with older code —
    # the correct version was already committed and pushed, and there was no CLI route to drop the copy.
    #
    # Naming a path IS the deliberate decision the refusal asks for ("look at them before deciding"), so
    # it is excluded here and nowhere else: everything unnamed is still refused, and `remove` still has to
    # be a plain in-checkout path.
    - name: The paths named for deliberate removal, as a LIST
      # A LIST, because one deliberate act commonly involves several files. `promote:gated` writes three
      # tracked artefacts at once — the weights, the training report and the acceptance report — and
      # `-e remove=` took exactly one, so naming any single file cleared it from the refusal below while
      # the other two still triggered it and the play aborted before the checkout ever ran. Measured
      # 2026-08-27: three invocations, one per file, all refused, nothing discarded.
      #
      # Comma-separated and split here rather than in each consumer. Verified by running it, not by
      # reading: `split(',')` inside `"{{ }}"` behaves, while `split('\n')` inside a FOLDED (`>-`) scalar
      # silently does not split at all — which cost a wrong classifier earlier the same day.
      ansible.builtin.set_fact:
        lab_removals: >-
          {{ (remove | default('')).split(',') | map('trim') | reject('equalto', '') | list }}

    - name: What remains unaccounted for
      ansible.builtin.set_fact:
        # `| default('')` because the task that registers `unpushed` is itself conditional: on a clean
        # tree it never runs, and a skipped register is a dict with no `stdout`. Written without it first,
        # which made this play fail on the one state it should say least about — a lab with nothing wrong.
        # A PLAIN scalar, never a folded one. Measured 2026-08-27 with a three-line playbook:
        # `split('\n')` inside `>-` returns ONE element and inside `"{{ }}"` returns three. YAML folding
        # eats the escape, so the blob never splits — and with a single dirty file the blob IS that path,
        # so `reject` matched and this looked correct for as long as only one file was ever dirty.
        # `promote:gated` writes THREE tracked artefacts, and against those `-e remove=` could never have
        # worked: every named path was compared against one blob containing all of them.
        lab_unpushed_unnamed: "{{ (unpushed.stdout | default('')) | trim | split('\n') | reject('equalto', '') | reject('in', lab_removals) | list }}"

    - name: Refuse to discard work origin does not have
      when: (dirty.stdout | trim) != '' and lab_unpushed_unnamed | length > 0
      ansible.builtin.fail:
        msg: >-
          {{ lab_repo_path }} has modified file(s) whose content is NOT on origin/{{ ref | default('main') }}:
          {{ lab_unpushed_unnamed | join(', ') }}. Nothing has been discarded. Commit and push them from
          the lab, or look at them before deciding — this play will not throw away work that exists
          nowhere else. To drop them deliberately, having looked: -e remove=<path>[,<path>...] -e apply=true.

    - name: Report only, unless asked to apply — and FAIL, so a caller can use this as a precondition
      # EXIT NON-ZERO ON A DIRTY TREE, because "I looked and it is dirty" and "it is clean" were the same
      # status and that cost a dispatch.
      #
      # Measured 2026-08-27: I ran bare `lab:reset` as a precondition before dispatching `everything`,
      # read exit 0 as "the lab is clean", and dispatched into a checkout still holding an uncommitted
      # baseline. `run-job.yml` refused correctly at the far end — the system worked — but the whole point
      # of a precondition is to find that out before spending a dispatch on it.
      #
      # This matches every other audit here: `corpus:urls` exits 1 when a URL has moved, `evidence:check`
      # exits 1 or 2 rather than reporting drift on a zero, and `rules:real-pages` exits 2 when it cannot
      # measure. A report that finds something says so in its status, or callers cannot act on it.
      #
      # `-e apply=true` is unaffected and still exits 0 on success: acting on the finding is the outcome
      # this refuses to let you skip by accident, not the one it punishes.
      when: (dirty.stdout | trim) != '' and not (apply | default(false) | bool)
      ansible.builtin.fail:
        msg: >-
          {{ lab_repo_path }} is DIRTY and nothing was discarded — this was a report.
          {{ (dirty.stdout | trim | replace('\n', '; ')) }}.
          Re-run with `-e apply=true` to discard what origin already carries, or commit it from the lab.
          A job dispatched into this checkout will be refused at the far end, having spent the dispatch.

    - name: Discard the tracked changes
      # `git checkout --` is the command that once destroyed release-eligible weights in this repo, which
      # is why it runs only after the comparison above proves every path is recoverable from origin.
      when: (dirty.stdout | trim) != '' and (apply | default(false) | bool)
      ansible.builtin.command:
        argv: [git, checkout, "--", "."]
        chdir: "{{ lab_repo_path }}"
      changed_when: true

    - name: Prove it is clean
      # Read BACK, never inferred from the command returning cleanly — the rule this repo applies to every
      # deploy and every provision.
      when: (dirty.stdout | trim) != '' and (apply | default(false) | bool)
      ansible.builtin.command:
        argv: [git, status, --porcelain]
        chdir: "{{ lab_repo_path }}"
      register: after
      changed_when: false

    - name: Remove untracked files that ORIGIN already carries
      # `git checkout --` restores tracked files and cannot touch an untracked one, so a changeset written
      # by `promote:gated` survived every reset and went on blocking `git pull` — the exact condition this
      # play exists to clear. Measured 2026-08-26: three resets in a row reported SAFE, cleaned the tracked
      # weights, and left `.changeset/promote-candidate-3.md` behind.
      #
      # Same containment as above and it matters more here, because removal has no undo: a path is deleted
      # ONLY if origin has a file at that path, so the copy being removed is recoverable by pulling. An
      # untracked file origin has never seen is somebody's work and is left alone.
      when: (dirty.stdout | trim) != '' and (apply | default(false) | bool)
      ansible.builtin.shell:
        cmd: >-
          git status --porcelain | awk '/^\?\?/ {print $2}' |
          while read -r path; do
            if git cat-file -e origin/{{ ref | default('main') }}:"$path" 2>/dev/null; then
              rm -f -- "$path" && echo "removed $path"
            else
              echo "kept $path (origin has never seen it)"
            fi
          done
        chdir: "{{ lab_repo_path }}"
      register: untracked
      changed_when: "'removed ' in (untracked.stdout | default(''))"

    - name: Every named removal must be a plain path inside the checkout
      when: remove is defined
      ansible.builtin.assert:
        that:
          - lab_removals | length > 0
          - lab_removals | select('match', '^[A-Za-z0-9._/-]{1,120}$') | list | length == lab_removals | length
          - lab_removals | select('search', '\.\.') | list | length == 0
        fail_msg: >-
          -e remove= must be one plain relative path, or several separated by commas; globs and traversal
          are not expressible. Got: {{ lab_removals | to_json }}

    - name: Remove a named untracked path, having looked at it
      # The escape hatch for the case the comparison above cannot settle: an untracked file origin has
      # never seen might be somebody's work or might be an artefact a job wrote, and only a human who has
      # READ it can tell. Measured 2026-08-26: `promote:gated` writes a changeset each time it runs, and
      # one superseded by a hand-written changeset blocked every pull while being safe to delete.
      #
      # Named explicitly, one path, never a glob — so this cannot become a `clean -fd` that takes work
      # with it. The path must still be untracked, which is checked rather than trusted.
      # NOT gated on the tree being dirty overall. A lone untracked file leaves `git status --porcelain`
      # non-empty but the TRACKED files clean, and the first version's `when: dirty != ''` still held —
      # until an earlier reset cleaned the tracked half, after which every task skipped and the play
      # reported "STILL DIRTY" about a file it had just declined to look at. A task gated on a condition
      # unrelated to what it does is a task that silently does nothing.
      when: remove is defined and (apply | default(false) | bool)
      ansible.builtin.shell:
        # A BLOCK scalar (`|`), never `>-`. Folding joins the lines, so the `if/else` became three
        # sequential statements and the refusal branch ran unconditionally — measured here, and the same
        # trap `lab-log.yml` hit an hour earlier with a pipeline. Multi-line shell needs `|`.
        cmd: |
          rc=0
          printf '%s\n' "$LAB_REMOVALS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            before=$(printf '%s\n' "$LAB_DIRTY_BEFORE" | grep -F -- " $path" | head -1 | cut -c1-2)
            if git status --porcelain -- "$path" | grep -q '^??'; then
              rm -f -- "$path" && echo "removed $path"
            elif [ -n "$before" ] && [ "$before" != "??" ]; then
              echo "restored $path (a TRACKED modification, discarded by the checkout above)"
            else
              echo "REFUSED: $path was neither untracked nor a tracked modification"
              rc=1
            fi
          done
          exit $rc
        chdir: "{{ lab_repo_path }}"
        # THE PRE-CHECKOUT PORCELAIN, handed to the shell rather than parsed in Jinja.
        #
        # It has to be the pre-checkout state: `git checkout -- .` above has already restored every
        # tracked modification, including this one, so asking git here cannot tell "it was tracked and we
        # just fixed it" from "it was never dirty". Those need opposite messages and one was printed for
        # both.
        #
        # Classified with `grep -F` — a LITERAL match, no regex, nothing to escape. The Jinja version of
        # this was written first and did not survive being run: `.split('\n')` inside a folded scalar
        # does not split, so `select('search', ...)` matched the whole blob and reported every path as
        # tracked. Measured with a three-line playbook, which is this repo's own rule for YAML+Jinja
        # escaping — settled by RUNNING it, never by reading.
      environment:
        LAB_DIRTY_BEFORE: "{{ dirty.stdout | default('') }}"
        LAB_REMOVALS: "{{ lab_removals | join('\n') }}"
      register: removed_named
      changed_when: "'removed ' in (removed_named.stdout | default('')) or 'restored ' in (removed_named.stdout | default(''))"
      # A refusal must REPORT, not abort. `exit 1` failed the play before the reporting tasks below, so
      # the operator saw an Ansible module error and no reason — three times on 2026-08-26 I read
      # "STILL DIRTY" about a file the play had just declined to explain. The task's own stdout carries
      # the verdict; the assert two tasks down is what decides the play's fate.
      failed_when: false

    - name: Say what the named removal did
      when: remove is defined and (apply | default(false) | bool)
      ansible.builtin.debug:
        msg: "{{ removed_named.stdout | default('(no output)') | trim }}"

    - name: A named removal that refused must fail the play, having SAID why
      when: remove is defined and (apply | default(false) | bool)
      ansible.builtin.assert:
        # EITHER outcome is success, and conflating them reported a done thing as a refusal.
        #
        # Measured 2026-08-27: naming a TRACKED modification bypassed the refusal above (which is the
        # documented, deliberate behaviour — "naming a path IS the decision the refusal asks for"),
        # `git checkout -- .` restored it, the tree came back clean, and then this assert failed with
        # "Nothing was deleted". The operator is told nothing happened by a play that had just acted,
        # which is worse than either a failure or a success: it invites a second, blinder attempt.
        that:
          - "'removed ' in (removed_named.stdout | default('')) or 'restored ' in (removed_named.stdout | default(''))"
        fail_msg: >-
          {{ removed_named.stdout | default('the removal produced no output') | trim }}.
          Nothing was changed. `-e remove=` takes ONE path that is dirty right now — either untracked
          (it is deleted, if origin carries a copy) or a tracked modification (it is restored from
          origin). `npm run lab:reset` with no -e remove reports what is dirty.

    - name: Say what happened to the untracked files
      when: (dirty.stdout | trim) != '' and (apply | default(false) | bool)
      ansible.builtin.debug:
        var: untracked.stdout_lines

    - name: Say what is left
      when: (dirty.stdout | trim) != '' and (apply | default(false) | bool)
      ansible.builtin.debug:
        msg: >-
          {{ 'CLEAN — the checkout can pull again.' if (after.stdout | trim) == ''
             else 'STILL DIRTY (untracked files are not discarded): ' ~ (after.stdout | trim) }}
