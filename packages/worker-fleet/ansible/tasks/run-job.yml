---
# Run a long job on the lab, detached and supervised, and wait for its real exit code.
#
#   - ansible.builtin.include_tasks: tasks/run-job.yml
#     vars:
#       job_name: train
#       job_argv: ["{{ lab_python }}", "packages/lab/scripts/train-screenreader-model.py", "--data", "..."]
#       job_timeout: 3600
#
# ## This is `run-interactive.yml` for Linux, and deliberately the same shape
#
# That file drives a long job on a Windows worker through a one-shot scheduled task, because SSH lands in
# session 0 and cannot reach the desktop. The lab has no such problem — SSH can run anything — so the
# reason here is different, but the SHAPE is identical and worth keeping identical: fire it, poll for it to
# stop, read its result BACK, print what it said, clean up whether it passed or failed, assert on the code.
#
# Its governing comment applies verbatim: `LastTaskResult` is "read back rather than inferred from
# Start-ScheduledTask returning cleanly — that call only means the request was accepted". `systemd-run`
# returning 0 means exactly the same thing and nothing more.
#
# ## What is being replaced
#
# `ssh root@REDACTED-INTERNAL-ADDRESS 'pct exec 121 -- bash -lc "..."'`, which is not in the source tree at all — so the
# way this project's most expensive operations were started was untested, unversioned and unreviewable. It
# cost, in two days: a heredoc mangled through two hops of shell quoting; a bash array that evaporated
# crossing `nohup bash -c`, sending four capture shards at `--worker=http://:8765` for 29 minutes while
# every worker sat idle; four `pgrep -f X` waiters that matched their own command lines and waited forever;
# and a job reported "still running" 28 minutes after it finished.
#
# `ansible.builtin.command` with `argv:` never invokes a shell, so the quoting class is gone by
# construction rather than by care. `systemd-run` gives the rest: a durable handle, an exit code, logs with
# rotation, a real timeout, and mutual exclusion by unit name.
#
# ## Three things measured on this box, each of which would otherwise be a bug here
#
#   1. **Poll `SubState`, never `systemctl is-active`.** With `--remain-after-exit` an exited unit stays
#      `active (exited)` forever, so `is-active` returns true for good. A waiter written that way hangs
#      indefinitely reporting "still running" for a finished job — which is the original incident,
#      reproduced inside its own fix. Measured: `is-active` says `active` while `show -p SubState` says
#      `exited`.
#   2. **`Result` and `ExecMainStatus` are populated WHILE the job runs.** Observed `Result=success
#      ExecMainStatus=0` on a job seven minutes from finishing. They are only meaningful once `SubState`
#      has left `running`, which is why they are read in a separate task after the poll and never before.
#   3. **`--remain-after-exit`, not `--collect`.** A collected unit is unloaded on exit and takes its exit
#      code with it — the handle would vanish at the moment it matters. Verified both ways on this
#      container: `/bin/true` leaves `Result=success ExecMainStatus=0`, and `exit 42` leaves
#      `Result=exit-code ExecMainStatus=42 ActiveState=failed` rather than disappearing.
- name: "Settle the defaults for: {{ job_name }}"
  ansible.builtin.set_fact:
    job_unit: "a11y-job-{{ job_name }}"
    # Exit codes other than 0 that mean success, matching `run-interactive.yml`'s `interactive_ok`.
    job_ok: "{{ [0] + (job_success_codes | default([])) }}"

- name: "What is this unit doing right now: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, show, "-p", SubState, "--value", "{{ job_unit }}"]
  register: job_before
  changed_when: false
  # An unknown unit is not an error here: it is the normal case, and `show` answers `dead` for one.
  failed_when: false

# Mutual exclusion, and the two cases must not be confused. A RUNNING job of this name is somebody else's
# work — including a previous invocation of this file from another shell — and killing it to make room
# would destroy hours. A unit left `failed` or `exited` from last time is just an unreaped handle, and
# refusing on that would mean every second run needed manual cleanup.
- name: "Refuse to start a second {{ job_name }} while one is running"
  ansible.builtin.assert:
    that: job_before.stdout | trim != "running"
    fail_msg: >-
      {{ job_unit }} is already running on {{ inventory_hostname }}. This is the lock working, not a fault.
      Watch it with `journalctl -u {{ job_unit }} -f`, or stop it deliberately with
      `systemctl stop {{ job_unit }}`.

- name: "Clear the handle left by a previous run: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, reset-failed, "{{ job_unit }}"]
  changed_when: false
  failed_when: false

- name: "Release the exited unit so the name is free: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, stop, "{{ job_unit }}"]
  changed_when: false
  failed_when: false

# The env is a FIXED dict built here, and nothing from the caller reaches it. `A11Y_PYTHON` is read at four
# sites in this repo and becomes the executed interpreter, so an env passthrough would be arbitrary code
# execution with a whitelisted job name and an empty argv. `PYTHONUNBUFFERED` is not cosmetic: without it a
# six-minute training run shows nothing in `journalctl` but its `Started` line until it exits, and live
# progress is the entire reason for having logs.
#
# The prefix is applied by replacing the EMPTY MATCH at the start, not by capturing the whole string into a
# backreference. `'^(.*)$' -> '--setenv=\\1'` reads better and does not survive the YAML-then-Jinja trip: the
# escape arrived at systemd literally, which refused the whole unit with
# `Cannot assign environment variable \\1: Invalid argument`. Loudly, and before starting anything — but a
# transformation with no backreference simply cannot fail that way.
#
# `job_setenv` does NOT weaken that, and the distinction is the whole point: it comes from the job CATALOGUE,
# which is a checked-in whitelist, and the one entry that uses it (`A11Y_WORKERS`, so a corpus run reaches
# the whole fleet) is built from the inventory and asserted against a strict address pattern before it gets
# here. A caller still supplies only a job name and enumerated arguments.
- name: "Is any other job running right now"
  # A pull writes into the checkout a running job is EXECUTING FROM -- `a11y-bootstrap.service` documents
  # that as "the one way this unit can be quietly wrong". The unit-name lock above only refuses a second job
  # of the SAME name, so a different job running concurrently is exactly the case it cannot see.
  ansible.builtin.command:
    argv: [systemctl, list-units, "a11y-job-*", "--state=running", "--no-legend", "--plain"]
  changed_when: false
  failed_when: false
  register: lab_other_jobs

- name: "Is somebody working in the lab checkout"
  ansible.builtin.command:
    argv: [git, status, --porcelain]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  register: lab_dirty

- name: "Whether this job may pull, in one place"
  # Named because it is used three times and because the REASONS are the interesting part: an explicit
  # `pull=false`, another job executing from this checkout, or somebody's uncommitted work in it. Any of the
  # three means the job runs at whatever is there -- which the stamp then records rather than hides.
  ansible.builtin.set_fact:
    lab_should_pull: >-
      {{ (pull | default(true) | bool)
         and (lab_other_jobs.stdout | default('') | trim) == ''
         and (lab_dirty.stdout | default('') | trim) == '' }}

- name: "Which ref this job runs at"
  # `-e ref=<branch>` runs a job at something other than main, and it exists for one specific, recurring
  # need: a change that CANNOT land on main by itself.
  #
  # A feature-schema change is the worked example. `scorer-artifact.test.ts` refuses a tree whose committed
  # weights carry a different `FEATURE_SCHEMA_VERSION` from the shipped feature pipeline — correctly, since
  # the scorer rejects that pairing at runtime and the default judge simply stops working. So the extractor
  # fix and the weights it produces must land in ONE commit; but the weights can only be trained by a lab
  # that already has the fix. Without this the only ways through are to break main for half an hour, or to
  # copy a file onto the box by hand — which is how the lab checkout got dirtied on 2026-08-23, blocking
  # every subsequent pull.
  #
  # Validated against a strict pattern rather than trusted: `command` with `argv:` never invokes a shell, so
  # this is not about injection, but `origin/$(anything)` should not be expressible from a `-e` var.
  ansible.builtin.set_fact:
    lab_ref: "{{ ref | default('main') }}"

- name: "A ref must look like a ref"
  ansible.builtin.assert:
    that:
      - lab_ref is match('^[A-Za-z0-9._/-]{1,100}$')
      - "'..' not in lab_ref"
    fail_msg: "ref must be a plain branch or tag name, got: {{ lab_ref }}"

- name: "Fetch origin"
  # THE STEP THAT WAS DONE BY HAND BEFORE EVERY JOB, which means it was done by hand or not at all. The lab
  # was once 23 commits behind `main` when a retrain was started on it, so the artefact named a commit that
  # had not produced it -- and an artefact whose provenance is wrong is worse than one carrying none.
  #
  # `command` with `argv:`, never `shell`, because this file's own test forbids a shell here and is right to:
  # the quoting class it removes is what sent four capture shards at `--worker=http://:8765` for 29 minutes.
  #
  # UNCONDITIONAL, unlike the fast-forward below. A fetch writes only to `.git`, so it is safe on a dirty
  # checkout and while another job runs — and it is the only way to know how far behind a checkout that
  # cannot pull actually is. Gated, it left the one case that needed measuring unmeasured.
  ansible.builtin.command:
    argv: [git, fetch, --quiet, origin]
    chdir: "{{ lab_repo_path }}"
  changed_when: false

- name: "Resolve the ref, whether it names a branch, a tag or a commit"
  # `origin/{{ lab_ref }}` works for a BRANCH and for nothing else. `A ref must look like a ref` accepts a
  # 40-character SHA -- it looks exactly like a ref -- and every use of it below then built `origin/<sha>`,
  # which resolves to nothing. So pinning a job to a commit, the most precise thing anyone would want to do
  # here, silently addressed a ref that does not exist.
  #
  # Resolved ONCE, to a commit, and everything downstream uses that. A branch name and a SHA then differ only
  # in how they are spelled, which is the property the caller expects.
  ansible.builtin.command:
    argv: [git, rev-parse, --verify, --quiet, "refs/remotes/origin/{{ lab_ref }}^{commit}"]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  failed_when: false
  register: lab_ref_as_branch

- name: "Failing that, resolve it as a tag or a commit this checkout already has"
  when: lab_ref_as_branch.rc != 0
  ansible.builtin.command:
    argv: [git, rev-parse, --verify, --quiet, "{{ lab_ref }}^{commit}"]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  failed_when: false
  register: lab_ref_as_object

- name: "Settle the commit this job runs at"
  ansible.builtin.set_fact:
    lab_ref_commit: >-
      {{ (lab_ref_as_branch.stdout | trim) if lab_ref_as_branch.rc == 0
         else (lab_ref_as_object.stdout | default('') | trim) }}

- name: "A ref must resolve to something, and say so when it does not"
  # An unresolvable ref must STOP the job. It previously produced `origin/<sha>` in three places, two of them
  # `failed_when: false`, so the drift count came back empty and read as zero -- a checkout reported up to
  # date with a ref that does not exist.
  ansible.builtin.assert:
    that:
      - lab_ref_commit | length == 40
    fail_msg: >-
      ref '{{ lab_ref }}' names no branch on origin, no tag, and no commit this checkout has after fetching.
      Push it first, or name a branch.

- name: "How far behind origin this checkout is"
  # A NUMBER, not a word, and this repo has the rule written down: "Examination was INCOMPLETE cannot tell
  # you whether two links were missed or two hundred."
  #
  # `Not pulling: the checkout is dirty` is true and useless. The lab sat 17 commits behind for days because
  # a training run left an artefact in the tracked tree, every job dutifully reported that one sentence, and
  # nothing said the consequence. The task above already carries the scar from the FIRST time this happened
  # ("the lab was once 23 commits behind"); the auto-pull fixed the case where pulling was possible and left
  # this one exactly as it was.
  ansible.builtin.command:
    argv: [git, rev-list, --count, "HEAD..{{ lab_ref_commit }}"]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  failed_when: false
  register: lab_behind

- name: "Settle how the drift should be described"
  ansible.builtin.set_fact:
    lab_behind_count: "{{ (lab_behind.stdout | default('0') | trim | int) }}"

- name: "Fast-forward to origin/{{ lab_ref }}"
  # `--ff-only`, never merge or rebase: a diverged lab checkout is a fact somebody needs to look at, not
  # something for a job launcher to resolve at 2am. If it cannot fast-forward, this fails and the job does
  # not start, which is the correct direction -- running unknown code is what the stamp below exists to stop.
  when: "{{ lab_should_pull }}"
  ansible.builtin.command:
    # `--ff-only` still, for the same reason: a diverged checkout is a fact somebody must look at, not
    # something a job launcher resolves at 2am. Moving BETWEEN refs is a checkout, not a merge, so a run at
    # a branch and the run back at main are both explicit acts the stamp below records.
    argv: [git, checkout, --detach, "{{ lab_ref_commit }}"]
    chdir: "{{ lab_repo_path }}"
  register: lab_pull
  changed_when: "'Already up to date' not in (lab_pull.stdout | default(''))"

- name: "Say why the checkout was left alone"
  when: not lab_should_pull
  ansible.builtin.debug:
    msg: >-
      Not pulling:
      {{ 'pull=false was passed' if not (pull | default(true) | bool)
         else ('another job is running (' ~ (lab_other_jobs.stdout | trim | replace('\n', '; ')) ~ ')'
               if (lab_other_jobs.stdout | default('') | trim) != ''
               else 'the checkout is dirty — somebody is working in it (' ~ (lab_dirty.stdout | trim | replace('\n', '; ')) ~ ')') }}.
      {{ 'This checkout is UP TO DATE with origin/main, so running it is the same as pulling.'
         if lab_behind_count | int == 0
         else 'This job therefore runs ' ~ lab_behind_count ~ ' COMMIT(S) BEHIND origin/main. Whatever it
               produces is stamped with that commit, not with the code you just pushed.' }}

- name: "Rebuild the compiled packages"
  # THE GATE SCORED CODE THAT WAS NOT THE CODE. `@a11y-witness/judge/rules` resolves to `dist/rules.js`,
  # so `rules:gate` runs COMPILED output — and a pull updates the source without touching it. Measured
  # 2026-08-22: a freshly added 2.4.2 rule fired when imported from source while the gate reported
  # `0/1 MISSING EVIDENCE`, because the lab's `dist/rules.js` contained zero occurrences of it. The gate
  # was correct about what it ran and wrong about what it claimed to be checking.
  #
  # CLAUDE.md already records the sibling — "a release-gate re-run measured code from three commits
  # earlier" — but that was a pull that silently FAILED. This is a pull that succeeded and a build that
  # never happened, which is harder to notice: `git log` says exactly what you expect.
  #
  # 3 seconds measured, so it runs whenever the pull changed anything rather than depending on cleverness
  # about which packages a given job touches.
  when: lab_pull is defined and lab_pull is changed
  ansible.builtin.command:
    argv: [/usr/bin/npm, run, build]
    chdir: "{{ lab_repo_path }}"
  changed_when: true

- name: "Record the commit this job actually runs at"
  # Recorded rather than assumed, and AFTER the pull, so it describes what will run. The stamp is the
  # difference between "the run says which code produced it" and "we know which code we asked for".
  ansible.builtin.command:
    argv: [git, rev-parse, HEAD]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  register: lab_commit

- name: "REFUSE to run at a commit other than the one asked for"
  # THE STAMP WAS RECORDED AND NEVER COMPARED, which is this repo's most-named defect wearing job
  # control: the value was right there, printed, and nothing acted on it.
  #
  # Measured 2026-08-25. `lab_should_pull` is false when the checkout is DIRTY — and an earlier
  # `rules:real-pages --update` had left a modified baseline file. So the checkout was skipped, three
  # consecutive jobs ran at a commit ~4 behind the one requested, and each reported success: two capture
  # runs produced "no pages for role 'fixture'" (the role did not exist at that commit) and I read them
  # as a corpus problem. The run says which code produced it; nobody was checking it was the code asked
  # for.
  #
  # A HARD REFUSAL rather than a warning, and rather than pulling anyway. A dirty checkout is somebody
  # else's uncommitted work — `run-job.yml` cannot tell a stray artefact from an edit in progress, which
  # is why it declines to pull in the first place — so the safe move is to stop and say what is in the
  # way, not to run stale code or to discard the work.
  when: lab_commit.stdout | trim != lab_ref_commit
  ansible.builtin.fail:
    msg: >-
      {{ job_name }} would run at {{ lab_commit.stdout | trim | truncate(12, true, "") }}, NOT the requested
      {{ lab_ref }} ({{ lab_ref_commit | truncate(12, true, "") }}).
      {{ 'The checkout is dirty, so it was left alone: ' ~ (lab_dirty.stdout | trim | replace('\n', '; '))
         if (lab_dirty.stdout | default('') | trim) != ''
         else ('Another job is running: ' ~ (lab_other_jobs.stdout | trim)
               if (lab_other_jobs.stdout | default('') | trim) != ''
               else 'pull=false was passed.') }}
      Nothing has run. Clear what is in the way on the lab and dispatch again — a job that quietly runs
      four commits behind reports success for code you did not ask for.
      {{ 'THIS ONE CLEARS ITSELF: the other job holds the checkout only while it runs, so re-dispatch when
          it finishes. Watch it with `npm run lab:status -- -e job=' ~
          ((lab_other_jobs.stdout | trim | regex_findall('a11y-job-([a-z0-9-]+)\.service')
            | default(['<name>'], true) | first)) ~ '`.'
         if (lab_other_jobs.stdout | default('') | trim) != ''
         else 'This one needs a decision: the checkout will stay this way until somebody commits or reverts
               what is in it.' }}

- name: "Running {{ job_name }} at {{ lab_commit.stdout | trim | truncate(12, true, '') }}"
  ansible.builtin.debug:
    msg: >-
      {{ job_name }} runs at {{ lab_commit.stdout | trim | truncate(12, true, "") }}
      {{ ('(pulled ' ~ lab_ref ~ ')') if (lab_pull is defined and lab_pull is changed)
         else (('(checkout unchanged, up to date with ' ~ lab_ref ~ ')') if lab_behind_count | int == 0
               else '(checkout unchanged and ' ~ lab_behind_count ~ ' COMMIT(S) BEHIND origin/' ~ lab_ref ~ ')') }}

# NO BYTECODE CACHE. A stale `__pycache__/*.pyc` makes a job execute code that is not in the checkout,
# which is what `REFUSE to run at a commit other than the one asked for` exists to prevent, one layer
# below where that guard can see it: it compares git SHAs, and the SHA is correct while the bytecode is
# not.
#
# The setting must go in the argv LIST and its explanation must not. Putting this comment inside the
# Jinja expression cost a pipeline run on 2026-08-25 — `#` is a syntax error there, and Ansible reported
# `unexpected char '#' at 245`, which names the character and not the file. `lab-job.test.ts` asserted
# only that the string was present, so it passed against a playbook that could not template.
# `--description` PUTS THE COMMIT IN THE JOURNAL, and that is the point of it.
#
# systemd logs `Started <unit> - <Description>.` as the first line of every run, so whatever goes here is
# the first thing `lab:log` and `lab:status` show and it cannot be separated from the output beneath it.
# Until 2026-08-27 the commit was known here -- `lab_commit` is registered forty lines up, and the task
# above prints it -- and went only into ANSIBLE's output, which is ephemeral and belongs to whoever
# dispatched. The journal is the artefact that gets read later, by someone else, and it carried a
# timestamp and no code identity.
#
# Measured cost, the day this was added: a `rules:coverage` journal reading `2.4.4 ... 0 never on a REAL
# page` was quoted into a defect list as a live contradiction against a local run saying `1 validated`.
# The lab was right and stale -- its run predated the fix by eleven hours -- and establishing that meant
# comparing a journal timestamp against `git log` by hand. That is CLAUDE.md's oldest lesson pointed at
# this file: a number is only as good as what it was computed from, so make every reported number carry
# that. Six of the seven diagnostics in that table were correct values read from the wrong window.
#
# The dirty marker is here rather than left implicit because the refusal above lets a dirty checkout run
# when it is ALREADY at the requested commit -- so `DIRTY` is the only signal that the bytes executed were
# not the bytes at that SHA. No shell is involved: this is one more element in the argv list.
- name: "Start it: {{ job_name }}"
  ansible.builtin.command:
    argv: >-
      {{ [
        "systemd-run", "--unit=" ~ job_unit, "--remain-after-exit",
        "--description=" ~ job_name ~ " at "
          ~ (lab_commit.stdout | trim | truncate(12, true, ""))
          ~ (" DIRTY" if (lab_dirty.stdout | default("") | trim) != "" else "")
          ~ " — " ~ (job_argv | join(" ")),
        "--working-directory=" ~ lab_repo_path,
        "--property=RuntimeMaxSec=" ~ (job_timeout | int),
        "--property=ReadWritePaths=" ~ lab_runs_path,
        "--setenv=PYTHONUNBUFFERED=1",
        "--setenv=PYTHONDONTWRITEBYTECODE=1",
      ] + (job_setenv | default([]) | map('regex_replace', '^', '--setenv=') | list) + [
        "--"
      ] + job_argv }}
  changed_when: true

- name: "Wait for it to finish: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, show, "-p", SubState, "--value", "{{ job_unit }}"]
  register: job_state
  changed_when: false
  # Polled rather than slept, and the budget is generous on purpose — the same reasoning as
  # `run-interactive.yml`: a deadline that expires early turns "still working" into "failed".
  retries: "{{ ((job_timeout | int) / 10) | round(0, 'ceil') | int }}"
  delay: 10
  until: job_state.stdout is defined and job_state.stdout | trim != "running"

# Read BACK, and only now — see note 2 in the header. These two answer different questions: `Result` says
# how it ended (`success`, `exit-code`, `timeout`, `signal`, `oom-kill`) and `ExecMainStatus` says with what
# code. A timeout reports `Result=timeout` with a signal status, which is why the assert below names both.
- name: "Collect its result: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, show, "-p", Result, "-p", ExecMainStatus, "--value", "{{ job_unit }}"]
  register: job_result
  changed_when: false

# THIS invocation's output, not the unit's whole history.
#
# `journalctl -u <unit>` returns every run of that unit since boot, oldest first. So a job that has run
# before hands back its PREDECESSOR's output above its own, and the two are distinguishable only by reading
# timestamps. That misled three separate diagnoses on 2026-08-23: a training report showed a two-day-old
# "seed smoke-test artifact" warning, a diagnostic showed a previous attempt's `can't open`, and
# `build-realism` appeared to report a stale record count, which read like a race between jobs and was not.
#
# systemd stamps every start with a unique `InvocationID`, so filtering on it returns exactly one run.
# `_SYSTEMD_INVOCATION_ID` is the journal field carrying it. Read AFTER the job finishes, so it is the id
# of the run just waited on.
- name: "Which run was this: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, show, "-p", InvocationID, "--value", "{{ job_unit }}"]
  register: job_invocation
  changed_when: false

- name: "Collect its output: {{ job_name }}"
  ansible.builtin.command:
    argv: [journalctl, "_SYSTEMD_INVOCATION_ID={{ job_invocation.stdout | trim }}",
           "--no-pager", "-n", "200"]
  register: job_log
  changed_when: false
  # An empty InvocationID would make this a journal-wide query rather than a scoped one, which is worse
  # than the problem: it would return other units' output. Refuse instead.
  failed_when: job_invocation.stdout | trim | length == 0

- name: "What it said: {{ job_name }}"
  ansible.builtin.debug:
    var: job_log.stdout_lines

- name: "Read the outcome it recorded: {{ job_name }}"
  ansible.builtin.set_fact:
    job_outcome: "{{ job_result.stdout_lines[0] | default('unknown') | trim }}"
    job_exit: "{{ job_result.stdout_lines[1] | default('-1') | trim | int }}"

# Released whether it passed or failed, matching `run-interactive.yml`'s reasoning about a one-shot task
# left registered. Here the cost of not releasing is smaller but real: the name stays taken, so the next
# run of this job has to reap it first.
- name: "Release the unit: {{ job_name }}"
  ansible.builtin.command:
    argv: [systemctl, stop, "{{ job_unit }}"]
  changed_when: false
  failed_when: false

- name: "Did this job write into the source tree"
  # THE GENERAL FORM of the defect that cost today, rather than a fix for the one script that caused it.
  #
  # A job's output belongs in `runs/`, which is gitignored, so a well-behaved job leaves the checkout
  # exactly as it found it. Anything appearing here is a run writing into tracked source — and the cost is
  # not the stray file, it is that `run-job.yml` then REFUSES to pull into it (correctly, it cannot tell a
  # stray artefact from somebody's work in progress). The lab silently ran 17 commits behind for days that
  # way, and the only symptom was one true, useless sentence per job.
  #
  # Compared against the state BEFORE the job, so a checkout that was already dirty is not blamed on the
  # job that happened to run next — "it was already like that" and "you did this" are different answers,
  # and reporting one as the other is how a warning gets ignored.
  ansible.builtin.command:
    argv: [git, status, --porcelain]
    chdir: "{{ lab_repo_path }}"
  changed_when: false
  register: lab_dirty_after

- name: "Say so, loudly, if it did"
  when: (lab_dirty_after.stdout | trim) != (lab_dirty.stdout | default('') | trim)
  ansible.builtin.debug:
    msg: >-
      {{ job_name }} LEFT THE CHECKOUT DIRTY. A job's output belongs in runs/, which is gitignored; these
      paths are tracked source, so until they are reverted or committed every later job will refuse to pull
      and will run at stale code —
      {{ (lab_dirty_after.stdout | trim | replace('\n', '; ')) }}

- name: "Fail if it did not succeed: {{ job_name }}"
  ansible.builtin.assert:
    that: (job_exit | int) in (job_ok | map('int') | list)
    fail_msg: >-
      {{ job_name }} ended {{ job_outcome }} with exit {{ job_exit }} on {{ inventory_hostname }}
      (expected one of {{ job_ok }}).
      {{ ('THAT CODE MEANS: ' ~ job_exit_meanings[job_exit | string]) if job_exit_meanings[job_exit | string] | default('') else '' }}
      Its output is above, and all of it is still on the box:
      `journalctl -u {{ job_unit }}`. A `timeout` outcome means it hit RuntimeMaxSec={{ job_timeout }}s,
      which is a budget to raise rather than a failure to debug.
    success_msg: "{{ job_name }} completed ({{ job_outcome }}, exit {{ job_exit }})"
