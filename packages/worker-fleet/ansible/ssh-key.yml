---
# Install the operator's public key on a worker, so every later play is unattended.
#
#     ansible-playbook ssh-key.yml -l a11y-worker-4 -e a11y_operator_key="$(cat ~/.ssh/id_ed25519.pub)"
#
# ## The chicken and egg, stated rather than discovered later
#
# Ansible needs sshd and this key on a box before it can do anything — and both are installed BY
# provisioning. So this playbook cannot be the first touch on a machine unless the key was planted at
# install time. Two ways in:
#
#   - `autounattend.xml` at Windows install time plants the key at first boot, and then there is no console
#     visit at all. This is the right answer for a fleet being installed from scratch and is what the
#     PXE/iVentoy work was heading towards.
#   - Otherwise the first touch is manual (`irm ... | iex` at the console), and runs 2..n are unattended.
#
# This playbook exists for the second case and for key ROTATION, which has no bootstrapping problem
# because the old key still works while you install the new one.
#
# ## administrators_authorized_keys, not ~/.ssh/authorized_keys
#
# `witness` is an Administrator, and Windows OpenSSH ignores a per-user authorized_keys for admin accounts
# in favour of one shared file with strict ACLs. Getting this wrong is the single most common reason key
# auth "silently fails" on Windows: sshd reads nothing, offers password auth, and the blank-password
# account cannot use it (LimitBlankPasswordUse confines it to console logon) — so the symptom is a
# permission denial that looks like a wrong key.
#
# The ACL matters as much as the path. sshd REFUSES a key file that any non-admin can write, and it refuses
# it silently from the client's point of view.
- name: Install the operator SSH key
  hosts: a11y_workers
  gather_facts: false

  tasks:
    - name: Refuse to run without a key
      # A play that "succeeds" having installed an empty string would leave a box that looks managed and
      # is not — and the next play would report an auth failure with no hint of the cause.
      ansible.builtin.assert:
        that:
          - a11y_operator_key is defined
          - a11y_operator_key | trim | length > 0
          - a11y_operator_key is search('^(ssh-|ecdsa-)')
        fail_msg: >-
          Pass the PUBLIC key, e.g.
          -e a11y_operator_key="$(cat ~/.ssh/id_ed25519.pub)".
          It must start with ssh- or ecdsa-; if yours starts with "-----BEGIN" you have handed over a
          PRIVATE key and should rotate it.
      delegate_to: localhost
      run_once: true

    # `win_powershell` rather than `win_shell`, and not by preference: `win_shell` is a FREE-FORM module, so
    # Ansible parses the script as module arguments before it ever reaches the box. A PowerShell here-string
    # (@' ... '@) reads as unbalanced quotes to that parser and the play fails with "failed at splitting
    # arguments", which points at the YAML rather than at the quoting that caused it.
    #
    # Passing the key as a PARAMETER instead of interpolating it into the script is the other half. A key
    # is attacker-influenced text from this script's point of view, and Jinja-substituting it into source
    # about to be executed is the shape of an injection even when the value is benign.
    - name: Add the key to administrators_authorized_keys and lock the file down
      become: true
      ansible.windows.win_powershell:
        parameters:
          Key: "{{ a11y_operator_key | trim }}"
        script: |
          param([string]$Key)
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          if (-not (Test-Path $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }
          $existing = @(Get-Content -Path $path -ErrorAction SilentlyContinue)
          if ($existing -contains $Key) {
            $Ansible.Changed = $false
            'present'
          } else {
            # Append, never overwrite: another operator's key in this file is not ours to remove, and
            # replacing it is how you lock a colleague out of a box they are mid-way through debugging.
            Add-Content -Path $path -Value $Key
            $Ansible.Changed = $true
            'added'
          }
          # sshd silently ignores this file if anyone but Administrators/SYSTEM can write it, and it does so
          # without telling the client — so the ACL is part of installing a key, not a tidy-up afterwards.
          icacls.exe $path /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
      register: key_install

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: operator key {{ key_install.output | first | default('?') }}"
